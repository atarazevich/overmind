<title>Overmind — live board (v3)</title>
<!--
  PROVENANCE, ASSUMPTIONS, OPEN QUESTIONS  —  dashboard-v3, drawn 2026-09-17
  ---------------------------------------------------------------------------
  DATA. Every event, name, number, command and quote on this board is real.
    · ~/Library/Application Support/Overmind/events.jsonl, snapshot 21:31 UTC:
      778 events, 6 sessions, 2026-09-17 19:14:49 -> 21:30:59 UTC, judge jev-1.13.0.
    · Chat names from ~/.claude/sessions/*.json (name, cwd, sessionId).
    · Message text, agent replies, escape markers and the 41 Bash commands behind
      the "About to break something" dots are joined from the owner's own
      transcripts (~/.claude/projects/**/<session>.jsonl, 2026-09-17). The join is
      PreToolUse hook event -> nearest preceding Bash tool_use in the same session:
      460 of 462 matched, 41 of 41 risky fires matched.
    · experiments/results/conduct-classes-2026-09-17_223900/turns.json (issue #14)
      arrived while this board was being drawn and is wired in: 12 sessions, 247
      agent turns scored by jev-latest, 25 interruptions (19 Corrections, 6
      Nudges), 8 conduct classes per turn, fires at 0.50. One of its 12 sessions
      is one of today's six live chats (056965b2, voice-dictation-intent), so that
      chat carries real per-class scores on every turn and in its class panel; the
      other five say so instead of guessing. rule_dropped and burn carry the run's
      own not-measurable reasons. The conversation band itself is reconstructed
      from the event log plus the transcripts, because turns.json covers other
      days, not today's six chats.

  KEY MAP (old log keys -> the class names in docs/signals.md).
      risky    -> About to break something      41 fired / 462 judged.  A hook rule
                  over the command text, not a conduct class. Stays on the board.
      drifting -> Doing too much     DROPPED by round 2 (+10 pp). Off the board.
      stuck    -> Going in circles   REWRITE by round 2 (-7 pp). Off the board.
    claims_done and needs_owner are NOT classes. They are free facts read from the
    text: claims_done feeds "Claims of done" and the "Says done" mark, needs_owner
    feeds the "Wants you" run state. Today they arrive as judge answers; the shipped
    version reads them. That difference is labelled in their tooltips. sharp_turn
    stays a timeline marker, per signals.md.

  MOTION. The real log is replayed forward at x40. The loop is 20:04:00 -> 20:26:00
    UTC, the 22 minutes that hold the day's one Correction; everything before the
    playhead is history, already counted. The pulse window is 20 minutes, so it
    crosses the band in 30 s at x40. No event is invented, none is moved.
    The board OPENS at 20:16:34 on claude-ec, a minute after that Correction, so
    the first five seconds show the one thing that happened today. From there the
    replay runs to 20:26, wraps to 20:04, and rebuilds it.

  DECISIONS THE TICKET DID NOT MAKE (see the note):
    1. The conversation band is reconstructed from the event log joined to the
       owner's transcripts (message text, escape markers, the 41 Bash commands),
       rather than left empty, because turns.json covers other days' sessions and
       overlaps today's six chats in exactly one.
    2. Plotly draws the pulse only. Rail, conversation and numbers are DOM.
    3. The replay loops a 22-minute slice of the log rather than all 2h16m.
    4. The board opens on the chat that has a story, not on whichever sorts first
       at the loop edge. See MOTION.

  ROUND 4 — the answer arrives first, and only what is earned is shown.
    1. VERDICT. "6 chats · 1 Correction · 5 of 6 clean runs" is now the largest
       text on the board and sits above the Pulse. Everything under it is the
       evidence for it. When a chat is Wants you, that line takes the top slot
       in rust with a solid rust block, and the day sentence drops to the line
       beneath at 15px — still larger than anything else.
    2. WHAT IS EARNED. experiments/results/conduct-classes-2026-09-17_230813
       (the truncation-matched control, docs/signals.md "What survived
       measurement") replaces the round-1 scores that were on this board.
       Of nine questions: jumped KEEP (+38 pp), wrong_room KEEP as a rule
       (+19 pp), the other seven dropped or rewritten. So:
         · the panel shows two signals with their measured lift, not ten rows;
         · dropped classes get no chip anywhere — no "Doing too much 0.65";
         · the "Doing too much" circles are off the Pulse;
         · the run states Off the rails and Going in circles are gone, because
           both rules rest on questions round 2 dropped. Wants you, Working,
           Idle, Quiet remain, and all four are read, not judged;
         · the Correction block no longer says "reads as Gone dark" — Gone dark
           was truncation (-6 pp). It says how deep into the turn you pressed.
    3. RAIL. Idle and Quiet rows collapse to 56px, name + id + elapsed, no
       sparkline. Live rows keep the full 120px. Rows at rest carried a 2px
       grey stub and 180px of air each.
    4. ACCENT LADDER, four gears, top gear used once:
         solid rust block + 30px rust ...... a chat wants you. Nothing else fills.
         2px rust rule + 15px rust italic .. a Correction, the ground truth.
         rust hairline, 10.5px ............. chips, near misses, pulse ticks.
         coral ............................. you and now: your marks, playhead.
    5. WINDOWS. The day numbers all live in the verdict block and say so once.
       The bottom band is one chat, one window, and every stat carries its own
       denominator and unit. "Clean run Yes/No" is cut — it restated Corrections
       and was what contradicted Near misses.
    6. TOOLTIP. Never over its subject, never over the rail (a rail row's
       tooltip opens to the right of the whole rail), and two type treatments:
       sans for the prose, mono for the arithmetic. No fill panel inside it.
    Panel borders and white fills are cut; white is now reserved for one thing,
    an agent turn. The three bands sit on one cream ground.

  ROUND 5 — the lower two thirds. The top third was passed by the critic and is
  untouched: the verdict line, the Pulse, the spine and the terracotta quote.
    1. PARAMETERS. The band the owner asked for at the very start and the
       redesigns lost — "I can see the events affecting those parameters." Three
       numbers this chat produced, on the Pulse's own x: same gutter (widened to
       150 for both bands together), same 20 minutes, same 5-minute gridlines,
       the intervention carried through as the same rust rule, and the chat's
       turns as ticks along its top. On claude-ec at 20:18 the Correction at
       20:15:02 stands between a flat wire and five commands climbing to 0.94,
       with Wants you spiking to 0.96 and Says done to 0.98 behind it.
       THE SERIES ARE NOT A CHOICE OF MINE — they are the only per-event numbers
       the log holds for every chat: risky on every Bash call, needs_owner at
       every stop, claims_done at every stop and subagent return. The two earned
       conduct classes are deliberately absent: the conduct run scored 12
       sessions on OTHER DAYS (jev t values are negative here), so nothing of
       theirs falls inside today's twenty minutes, and a line drawn from nothing
       would be the speculative fourth series. They keep their panel below.
       Every mark is one reading. Nothing is held across a gap.
    2. THE VOID IS CLOSED BY THE LAYOUT, NOT BY THE STRIP. The conversation is
       now as tall as its turns up to a ceiling, and the strip takes the slack
       (1fr). A three-turn chat widens the lines instead of leaving 550px of
       cream; a 24-turn chat pushes the strip to its floor.
    3. TOOLTIP, FOURTH ATTEMPT, NEW MECHANISM. Ground dims to var(--paper) .74,
       subject raised above the scrim at full strength, leader line from panel
       to subject ending in a dot on it. Placement rules are unchanged and are
       no longer the thing doing the work.
    4. THE HEADLINE COUNTS THE DAY. It counted only this log and printed
       "1 Correction" above a Correction block from 17:10. Today = inside the
       log + before it, per chat, so the headline, the fine line, the
       conversation meta and the per-chat stat now agree at every playhead.
    5. PULSE. Every lane has a wire, so an empty lane reads as a quiet chat and
       not a broken one; dots are up from 2px/.22 to 4.5–5.5px/.38–.62; the
       full-height bars are named by a key on the band and by a label on the
       rule itself.
    6. ACCENT LADDER, now separated by weight and not only by hue.
       Gear 1, full rust, two things only: a chat wants you, and a Correction
         (its rule is 3px against every other rule's 1px).
       Gear 2, rust at ~.6–.8: near misses, chips, the strip's readings.
       Gear 3, coral: you and now — your marks, the playhead, a running turn's
         growing edge. The word "running" and the live box's outline lost it.
       Gear 4, ink and grey: measured lifts (+38 pp was rust), the scrubber.
    CUT: the four 40px numerals (the numbers stay at reading size, on one row
    under the strip that plots them), judge 965 ms, cost $0.014, "bars: 20 min",
    and two paragraphs compressed to one line that keeps both meanings.

  ONE INVENTED VALUE: --rust #A6472B, the alert. The ticket named the palette but
    not this one ("a deeper rust that belongs to that palette"). It is the coral
    #D97757 taken down in lightness and saturation. Everything else is a token.

  OPEN QUESTIONS FOR THE OWNER:
    a. Off the rails and Going in circles are removed here because the classes
       under them were dropped. signals.md still lists both as run states. Do
       they get rewritten rules, or do they leave the spec too?
    b. Should the pulse lanes re-sort with the rail, or stay fixed as they are?
    c. When a chat has more turns than fit, the oldest go. Should a Correction be
       pinned so it never leaves the band while the chat is on screen?
    d. Is the "already happened" history above the playhead wanted at all, or
       should a chat's conversation start at the loop edge?
-->
<script src="../../../overmind/static/vendor/plotly.min.js"></script>
<style>
:root{
  --paper:#FAF9F5; --surface:#FFFFFF; --fill:#F0EEE6;
  --ink:#141413; --sec:#6B6B68; --line:#E5E3DC;
  --coral:#D97757; --rust:#A6472B;
  --serif:Georgia,"Source Serif 4","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:12px;-webkit-font-smoothing:antialiased}
.app{height:900px;padding:14px 20px 12px;display:flex;flex-direction:column;gap:12px}

/* ---------- header ---------- */
header{height:40px;display:flex;align-items:baseline;gap:14px;flex:0 0 40px}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:-.01em}
.tagline{color:var(--sec);font-size:12px}
.replay{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{font-family:var(--mono);font-size:17px;letter-spacing:.02em}
.rate{color:var(--sec);font-size:11px;font-family:var(--mono)}
.track{width:150px;height:2px;background:var(--line);position:relative}
/* GEAR 4. The scrubber is chrome. It used to carry the same terracotta as a
   Correction, and outranked it by being 150px long. */
.track i{position:absolute;left:0;top:0;height:2px;background:rgba(20,20,19,.30);width:0}
button.restart{font:inherit;font-size:11px;color:var(--sec);background:none;
  border:1px solid var(--line);padding:3px 9px;cursor:pointer}
button.restart:hover{color:var(--ink);border-color:var(--sec)}

/* ---------- frame ----------
   ROUND 4: no panel borders, no white panel fills. White is reserved for one
   thing on this board — an agent turn. The bands sit on one cream ground and
   are separated by a single hairline each, so they read as one instrument. */
.frame{flex:1;display:grid;grid-template-columns:302px 1fr;gap:0;min-height:0}
.band{min-height:0;display:flex;flex-direction:column}
.band > h2{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.11em;
  text-transform:uppercase;color:var(--sec);padding:0 0 7px;
  display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.band > h2 .r{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:var(--sec)}
.ptitle{font-size:11px;font-weight:500;color:var(--sec);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- verdict: the answer, above the evidence ---------- */
.verdict{flex:0 0 auto;padding:1px 0 0}
.vline{font-family:var(--serif);font-size:30px;line-height:1.12;letter-spacing:-.012em;
  display:flex;align-items:baseline;gap:10px}
.vline b{font-weight:400}
.vline .w{color:var(--sec)}
/* TOP GEAR of the accent, used in exactly one place on the whole board:
   a chat is waiting for the owner. Nothing else on the board is filled rust. */
.vwants{color:var(--rust);display:flex;align-items:baseline;gap:11px}
.vwants .blk{width:11px;height:23px;background:var(--rust);flex:0 0 11px;align-self:center}
.vsmall{font-size:15px;line-height:1.3;color:var(--sec);margin-top:5px;font-family:var(--serif)}
.vsmall b{font-weight:400;color:var(--ink);font-family:var(--mono);font-size:14px}
.vfine{margin-top:7px;display:flex;gap:15px;align-items:baseline;font-size:10.5px;color:var(--sec);flex-wrap:wrap}
.vfine b{font-weight:400;color:var(--ink);font-family:var(--mono)}
.vfine .lab{color:var(--sec)}
.vfine .foot{margin-left:auto}

/* ---------- rail ---------- */
.rail{overflow:hidden;padding-right:14px;position:relative}
.rail:after{content:'';position:absolute;right:0;top:0;width:1px;background:var(--line);height:var(--rh,100%)}
.rail .rows{position:relative;flex:1}
.crow{position:absolute;left:0;right:14px;border-bottom:1px solid var(--line);
  padding:10px 10px 9px 13px;cursor:pointer;overflow:hidden;
  transition:transform .55s cubic-bezier(.4,0,.2,1),height .35s cubic-bezier(.4,0,.2,1),background .3s}
.crow:hover{background:rgba(240,238,230,.55)}
.crow.sel{background:var(--fill)}
.crow:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.crow.sel:before{background:var(--coral)}
.crow.wants:before{background:var(--rust);width:3px}
.crow .n1{display:flex;align-items:baseline;gap:6px}
.cname{font-family:var(--serif);font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:176px}
.crow.slim .cname{font-size:13.5px;color:var(--sec)}
.crow.slim .spark,.crow.slim .dots{display:none}
.cproj{font-size:10.5px;color:var(--sec);font-family:var(--mono)}
.state{margin-left:auto;font-size:10.5px;white-space:nowrap}
/* top gear again: the only filled accent in the rail */
.state.wants{color:var(--paper);background:var(--rust);padding:2px 7px 3px;font-size:11px;letter-spacing:.01em}
.state.work{color:var(--ink)}
.state.idle,.state.quiet{color:var(--sec)}
.n2{display:flex;align-items:baseline;gap:6px;margin-top:3px;font-size:10.5px;color:var(--sec)}
.n2 .el{margin-left:auto;font-family:var(--mono)}
.spark{margin-top:9px;height:26px;width:100%;display:block}
.dots{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--sec);overflow:hidden}
.dots span{white-space:nowrap}
.dots .win{color:var(--sec)}
/* GEAR 2. A routine near miss is the accent at half strength. Full-strength
   rust on this board means exactly two things: a chat wants you, or you
   stopped one. */
.dots b{font-weight:400;color:rgba(166,71,43,.78)}
.dots .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(166,71,43,.50);
  margin-right:4px;vertical-align:1px}
.dots .dot.q{background:rgba(107,107,104,.4)}

/* ---------- main ----------
   ROUND 5: five rows, and the void is gone. The parameter strip takes every
   pixel the conversation does not use (1fr), so a short chat widens the lines
   instead of leaving half the board blank. The conversation keeps a fixed
   height so fitConv has something definite to fit into. */
.main{display:grid;grid-template-rows:auto 112px auto 1fr 150px;gap:12px;min-height:0;padding-left:16px}
#pulse{flex:1;min-height:0}
.band.nums{border-top:1px solid var(--line);padding-top:8px}

/* ---------- parameters ----------
   ROUND 5, the thing the owner asked for first and the redesigns lost: the
   numbers over time with the events visibly moving them. Same x geometry as
   the Pulse — left gutter 124px, right margin 10px, same 20-minute window,
   same 5-minute gridlines — so a turn, an intervention and the line they moved
   sit on one vertical. */
.band.params{min-height:126px}
#params{flex:1;min-height:0;position:relative}
#params svg{display:block;width:100%;height:100%}

/* ---------- conversation ----------
   ROUND 5: the band is as tall as the turns it holds, up to a ceiling. A chat
   with three turns no longer leaves 550px of cream under it — the parameter
   strip below takes the slack, and a long chat pushes the strip down to its
   floor instead. This is what closed the void; the strip only filled it. */
.band.conv{overflow:hidden;position:relative;max-height:306px}
.scroll{flex:1;overflow:hidden;padding:3px 4px 4px 0}
.spine{position:absolute;left:353px;top:0;bottom:0;width:1px;background:var(--line)}
.turn{position:relative;display:grid;grid-template-columns:344px 18px 1fr}
.mark{position:absolute;left:350.5px;top:5px;width:7px;height:7px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(20,20,19,.35)}
.mark.me{background:var(--coral);border-color:var(--coral)}
.mecell{grid-column:1;text-align:right;padding:0 16px 12px 0}
.agcell{grid-column:3;padding:0 0 12px 16px}
.full{grid-column:1/-1}
.who{font-size:10px;letter-spacing:.04em;color:var(--coral);margin-bottom:3px}
.who span{color:var(--sec);font-family:var(--mono);margin-left:6px}
.me.sys .who{color:var(--sec)}
.me .txt{font-family:var(--serif);font-size:13.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.me.sys .txt{font-family:var(--sans);font-size:11.5px;color:var(--sec)}
.agbox{border:1px solid var(--line);background:var(--surface);padding:8px 11px 9px;max-width:690px;position:relative}
/* GEAR 3, coral, is "you and now" — and now is said once, by the edge that
   grows. The full coral outline made a running turn compete with a Correction. */
.agbox.live{border-color:var(--line);border-left:2px solid var(--coral);background:var(--surface);
  padding-left:10px}
.agmeta{display:flex;align-items:baseline;gap:9px;font-size:10.5px;color:var(--sec);font-family:var(--mono)}
.agmeta > span{white-space:nowrap;flex:0 0 auto}
.agmeta .ext{flex:0 1 auto;min-width:2px}
.agmeta .ext{height:3px;background:rgba(20,20,19,.22);display:inline-block;min-width:2px;align-self:center}
.agbox.live .agmeta .ext{background:var(--coral)}
.agtxt{font-size:11.5px;color:var(--sec);margin-top:5px;line-height:1.4;max-width:660px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
/* GEAR 2 */
.sig{font-size:10.5px;color:rgba(166,71,43,.80);border:1px solid rgba(166,71,43,.26);padding:1px 6px}
.sig.q{color:var(--sec);border-color:var(--line)}
/* GEAR 1. A Correction is the loudest mark on the board and now has the weight
   to prove it: a 3px rule against every other rule's 1px, and the quote a size
   up. Nothing else on the board is a filled rust rule. */
.cut{padding:4px 0 12px}
.cut .rule{height:3px;background:var(--rust)}
.cut .lab{font-size:10.5px;color:var(--rust);letter-spacing:.03em;margin-top:6px}
.cut .quote{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--rust);margin-top:4px;line-height:1.32}
.gap{font-size:10.5px;color:var(--sec);font-family:var(--mono);padding:0 0 14px;text-align:center}
.prior{padding:0 0 2px;margin-bottom:17px}
.prior .lab{font-size:10.5px;color:var(--rust);letter-spacing:.03em}
.prior .quote{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--rust);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- numbers ----------
   ROUND 5: the four 40px numerals are gone. The numbers stay, at reading size,
   on one row directly under the strip that plots them, so they belong to the
   turns above instead of opening a second document. */
.numsgrid{flex:1;display:grid;grid-template-columns:1fr 556px;gap:0;min-height:0}
.statwrap{padding:0 24px 0 0;display:flex;flex-direction:column;min-height:0}
.stats{display:flex;gap:0;margin-top:8px}
.stat{flex:1;padding-right:16px}
.stat .v{font-family:var(--serif);font-size:19px;line-height:1.05;letter-spacing:-.01em}
.stat .v.alert{color:var(--rust)}          /* gear 1: a Correction */
.stat .v.warn{color:rgba(166,71,43,.78)}   /* gear 2: a routine near miss */
.stat .k{font-size:11.5px;margin-left:6px}
.stat .m{font-size:10.5px;color:var(--sec);margin-top:4px;line-height:1.35;font-family:var(--mono)}
.classes{border-left:1px solid var(--line);padding:0 0 0 20px;display:flex;flex-direction:column}
.erow{padding:4px 0 5px;border-bottom:1px solid var(--line)}
.erow .e1{display:flex;align-items:baseline;gap:9px}
.erow .en{font-size:13px}
/* GEAR 4. A measured lift is a measurement, not an alarm. It used to be rust. */
.erow .elift{font-family:var(--mono);font-size:12px;color:var(--ink);margin-left:auto}
.erow .ekind{font-size:10.5px;color:var(--sec)}
.erow .e2{font-size:10.5px;color:var(--sec);margin-top:2px;font-family:var(--mono);line-height:1.35}
.trust{margin-top:auto;padding-top:7px;font-size:10.5px;color:var(--sec);line-height:1.45}

/* ---------- tooltip, FOURTH ATTEMPT — the mechanism changes, not the offsets.
   Three rounds of moving the panel failed because nothing said what it explained.
   Now: (1) the ground dims to paper, so every mark except the subject washes out;
   (2) the subject paints above the scrim at full strength; (3) a leader runs from
   the panel to the subject. Placement rules stay, but they are no longer the
   thing doing the work. The scrim is var(--paper): the cream ground does not
   change colour, only the ink on it recedes. ---------- */
#scrim{position:fixed;inset:0;background:var(--paper);opacity:0;z-index:55;
  pointer-events:none;transition:opacity .12s}
#scrim.on{opacity:.74}
#leader{position:fixed;left:0;top:0;width:1440px;height:900px;z-index:61;
  pointer-events:none;opacity:0;transition:opacity .12s}
#leader.on{opacity:1}
/* z-index only. A rail row is already absolutely positioned, and forcing
   position:relative on it moved the row out from under its own tooltip. */
.tipsub{z-index:60}
#tip{position:fixed;z-index:62;width:286px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 2px 12px rgba(20,20,19,.10);
  padding:10px 12px 11px;pointer-events:none;opacity:0;transition:opacity .12s}
#tip .l1,#tip .l3{font-size:11.5px;line-height:1.45;color:var(--ink)}
#tip .l3{margin-top:7px}
#tip .l2{font-family:var(--mono);font-size:10.5px;color:var(--sec);margin-top:7px;line-height:1.5;
  word-break:break-word}
[data-tip]{cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">Overmind</div>
    <div class="replay">

<script>
function raw(s){return String(s==null?'':s).replace(/\|/g,'/');}
function judgedUpTo(c,p,key){let n=0;for(const e of c.events){if(e.t>p)break;if(e.a&&e.a[key]!=null)n++;}return n;}
const JUMPED=EARNED[0], WRONGROOM=EARNED[1];
function jevFor(c,t0,t1,kind){
  if(!c.jev||kind==='resume')return null;
  let best=null;
  c.jev.forEach(x=>{ if(x.t>=t0-5&&x.t<=Math.min(t0+120,t1+60)){ const d=Math.abs(x.t-t0); if(!best||d<best.d)best={d:d,x:x}; }});
  return best?best.x:null;}
/* fires of the two earned signals inside one chat, or null if the conduct run
   never covered that chat. Nothing else is counted anywhere on this board. */
function earnedIn(c,p){
  if(!c.jev)return null;
  const J=c.jev.filter(x=>x.t<=p);
  return {n:J.length,
          jumped:J.filter(x=>(x.sc.jumped||0)>=.5).length,
          wrong:J.filter(x=>(x.ru&&x.ru.wrong_room||0)>=.5).length};}
function inRange(c,t0,t1){
  const r={tools:0,subs:0,risky:[],claims:[]};
  for(const e of c.events){ if(e.t<t0||e.t>t1) continue;
    if(e.k==='tool'){r.tools++; if((e.a.risky||0)>=.5)r.risky.push({t:e.t,p:e.a.risky,cmd:e.cmd});}
    else if(e.k==='sub'){r.subs++; if((e.a.claims_done||0)>=.5)r.claims.push({t:e.t,p:e.a.claims_done});}}
  return r;}
function longestSilence(c,t0,t1){let mx=0,prev=t0;
  for(const e of c.events){if(e.t<t0||e.t>t1)continue;if(e.t-prev>mx)mx=e.t-prev;prev=e.t;}
  if(t1-prev>mx)mx=t1-prev;return mx;}

/* ---------- conversation ---------- */
const scroll=$('#scroll');
let convKey='';
function extent(px){return Math.max(3,Math.min(300,px/2));}
/* The band never scrolls and never cuts an element in half: the newest turns
   are drawn from the top, and whole turns are dropped off the old end until
   what is left fits. Returns how many turns are on screen. */
function fitConv(nturns){
  const body=scroll.firstElementChild;
  const kids=[].slice.call(body.children).filter(e=>e.className==='turn'||e.classList.contains('turn'));
  let i=0;
  while(scroll.scrollHeight>scroll.clientHeight+1&&i<kids.length-1){
    const g=kids[i].getAttribute('data-t');
    let j=i;
    /* a Correction is pinned: it is the one thing on this board that was
       labelled for free, and dropping it off the old end loses the evidence
       for the only class that survived measurement. */
    while(j<kids.length&&kids[j].getAttribute('data-t')===g){
      if(!kids[j].querySelector('.cut,.prior'))kids[j].style.display='none';j++;}
    if(j>=kids.length){for(let k=i;k<kids.length;k++)kids[k].style.display='';break;}
    i=j;
  }
  while(i<kids.length-1&&kids[i].querySelector('.gap')){kids[i].style.display='none';i++;}
  /* if what is left still runs a few pixels long, drop reply previews from the
     oldest visible turn first. A box is never cut in half. */
  const vis=kids.filter(k=>k.style.display!=='none');
  for(let z=0;z<vis.length&&scroll.scrollHeight>scroll.clientHeight+1;z++){
    const tx=vis[z].querySelector('.agtxt'); if(tx)tx.style.display='none';
  }
  let first=nturns;
  for(let k=i;k<kids.length;k++){const d=kids[k].getAttribute('data-t');
    if(d!=null&&+d>=0&&+d<first)first=+d;}
  return Math.max(0,nturns-first);
}
function renderConv(p,force){
  const c=CHATS.find(x=>x.id===sel), s=snap(c,p);
  const lt=s.turns[s.turns.length-1];
  const key=[sel,s.turns.length,s.iv.length,lt&&(lt.t1==null||lt.t1>p)?'L':'E',
    lt?inRange(c,lt.t0,Math.min(lt.t1==null?p:lt.t1,p)).tools:0,lt&&lt.stop&&lt.t1<=p?1:0].join('|');
  if(key===convKey&&!force){updateLive(p);return;}
  convKey=key;
  $('#convtitle').textContent='Conversation \u2014 '+c.name;
  let h='<div class="convbody" style="position:relative"><div class="spine"></div>';
  c.prior.filter(x=>x.quote).forEach(x=>{
    const pt=(Date.parse(x.ts)-T0)/1000;
    const jc=(c.jev||[]).filter(y=>y.kind==='correction'&&y.t>pt-900&&y.t<pt+30).pop();
    /* Only a signal that survived the matched control may be named on a
       Correction. The top-scoring class is not the point; the earned one is. */
    const jp=jc?(jc.sc.jumped||0):null;
    const reads=jp!=null&&jp>=.5
      ? 'Acting, not answering '+jp.toFixed(2)+' \u2014 the one class that survived'
      : jc ? 'no earned class fires on it' : 'from the transcript';
    h+='<div class="turn" data-t="-1"><div class="full"><div class="prior" '
      +tipAttr('Earlier today, before this log begins, you stopped this chat and then spoke. '
        +(jp!=null&&jp>=.5?'This is the turn the one surviving class was measured on.':''),
        x.hhmm+' \u00b7 escape, '+x.depth+' assistant messages in \u00b7 your next message came '+x.gap+' s later'
          +(jp!=null?' \u00b7 Acting, not answering '+jp.toFixed(2)+', conduct run, matched control':''),
        'Nothing now. It is here because the run before this one ended in a Correction.')
      +'><div class="lab">Correction at '+x.hhmm+' \u00b7 earlier today, before this log \u00b7 '+reads+'</div>'
      +'<div class="quote">\u201c'+esc(trunc(x.quote,190))+'\u201d</div></div></div></div>';
  });
  let prevEnd=null, skipMe=false;
  s.turns.forEach((t,ix)=>{
    const tEnd=Math.min(t.t1==null?p:t.t1,p), live=(t.t1==null||t.t1>p);
    const R=inRange(c,t.t0,tEnd), stop=live?null:t.stop;
    const tiny=(tEnd-t.t0)<5&&R.tools===0&&R.subs>0;
    if(prevEnd!==null&&t.t0-prevEnd>120)
      h+='<div class="turn" data-t="'+ix+'"><div class="full"><div class="gap">'+dur(t.t0-prevEnd)+' quiet</div></div></div>';
    let meCell='', meMark='';
    if(t.text&&!skipMe){
      const sys=t.kind!=='owner';
      meMark=sys?'':' me';
      meCell='<div class="mecell"><div class="me'
        +(sys?' sys':'')+'" '+tipAttr(
          (sys?(t.kind==='agent-report'?'A background agent returned into this chat.':'A command you ran in this chat.')
              :'Your message at '+clockOf(t.t0)+'. It opened a turn that ran '+dur(tEnd-t.t0)+'.')
            +(t.kind==='owner'?' \u201c'+trunc(t.text,200)+'\u201d':''),
          clockOf(t.t0)+' \u00b7 that turn made '+R.tools+' tool calls and took '+R.subs+' subagent returns'
            +(t.sharp!=null?' \u00b7 sharp turn '+t.sharp.toFixed(2)+', a marker, not an alarm':''),
          t.kind==='owner'?'Nothing. This one is you.':'Nothing.')
        +'><div class="who">'+(t.kind==='owner'?'You':t.kind==='agent-report'?'Background agent':'You \u00b7 command')
        +'<span>'+clockOf(t.t0).slice(0,5)+'</span></div>'
        +'<div class="txt">'+esc(trunc(t.text,230))+'</div></div></div>';
    }
    skipMe=false;
    const sil=longestSilence(c,t.t0,tEnd);
    const chips=[];
    if(R.risky.length)chips.push('<span class="sig" '+tipAttr(
      'About to break something \u2014 '+R.risky.length+' command'+(R.risky.length===1?'':'s')+' in this turn '+(R.risky.length===1?'is':'are')+' hard to undo.',
      R.risky.map(r=>clockOf(r.t)+' '+r.p.toFixed(2)+' '+trunc(r.cmd,46)).slice(0,3).join(' \u00b7 '),
      'Decide before it runs. Today the board only notices.')+'>About to break something \u00d7'+R.risky.length+'</span>');
    /* ONLY the two signals that survived the matched control get a chip. The
       seven that did not are absent from every turn on this board, including
       the ones they used to score highest on. */
    const J=jevFor(c,t.t0,tEnd,t.kind);
    if(J){
      const jp=J.sc.jumped||0, wr=(J.ru&&J.ru.wrong_room)||0;
      if(jp>=.5)chips.push('<span class="sig" '+tipAttr(JUMPED.n+' \u2014 '+JUMPED.means+'.',
        'judge '+jp.toFixed(2)+' on this turn, over the 0.50 line \u00b7 '+J.msgs+' assistant messages, '
          +J.tools+' tool calls \u00b7 fires on '+JUMPED.corr+'% of corrections and '+JUMPED.clean
          +'% of matched clean turns, '+JUMPED.lift,
        JUMPED.act)+'>'+JUMPED.n+' '+jp.toFixed(2)+'</span>');
      if(wr>=.5)chips.push('<span class="sig" '+tipAttr(WRONGROOM.n+' \u2014 '+WRONGROOM.means+'.',
        (J.why&&J.why.wrong_room?J.why.wrong_room:WRONGROOM.how)+' \u00b7 a rule, not a judge answer \u00b7 '
          +WRONGROOM.corr+'% of corrections, '+WRONGROOM.clean+'% of matched clean turns, '+WRONGROOM.lift,
        WRONGROOM.act)+'>'+WRONGROOM.n+'</span>');
    }
    if(stop&&(stop.needs_owner||0)>=.5)chips.push('<span class="sig q" '+tipAttr(
      'It stopped on a question. Not a class \u2014 a free fact, read from the text.',
      'today the log carries it as a judge answer, '+stop.needs_owner.toFixed(2)+'; the shipped version reads it instead of asking',
      'Open this tab.')+'>Wants you</span>');
    if(stop&&(stop.claims_done||0)>=.5)chips.push('<span class="sig q" '+tipAttr(
      'It said it was done. Also a free fact, not a class.',
      'says done '+stop.claims_done.toFixed(2)+' \u00b7 whether the claim was backed is the class, and no judge is wired for it',
      'Ask for the number, the diff, the exit code.')+'>Says done</span>');
    const body=live?'':trunc(t.agentEnd||t.agent,140);
    h+='<div class="turn" data-t="'+ix+'"><span class="mark'+meMark+'"></span>'+meCell+'<div class="agcell">'
      +'<div class="agbox'+(live?' live':'')+'" '+tipAttr(
        'An agent turn in '+c.name+': '+(live?'running for ':'it ran for ')+dur(tEnd-t.t0)+' and made '+R.tools+' tool call'+(R.tools===1?'':'s')+'.',
        clockOf(t.t0)+' \u2192 '+(live?'now':clockOf(tEnd))+' = '+Math.round(tEnd-t.t0)+' s \u00b7 '+t.tools
          +' Bash calls, '+t.subs+' subagent returns \u00b7 longest stretch with no event '+dur(sil),
        R.risky.length?'Look at the '+R.risky.length+' flagged command'+(R.risky.length===1?'':'s')+' before it runs another.'
          :sil>240?'Ask for status; you had no sign of life for '+dur(sil)+'.':'Nothing.')+'>'
      +'<div class="agmeta"><span>'+(t.kind==='resume'?(R.tools===0&&R.subs?'Background agent':'Agent, already running'):'Agent')+'</span>'
      +(tiny?'<span>returned at '+clockOf(tEnd)+'</span>'
        :'<span class="ext" data-ext style="width:'+extent(tEnd-t.t0).toFixed(0)+'px"></span>'
         +'<span data-el>'+dur(tEnd-t.t0)+'</span><span data-tc>'+R.tools+' tool call'+(R.tools===1?'':'s')+'</span>')
      +(R.subs?'<span>'+R.subs+' subagent'+(R.subs===1?'':'s')+'</span>':'')
      +(live?'<span style="color:#D97757">running</span>':'')
      +(t.queuedNote?'<span>you queued the next one</span>':'')+'</div>'
      +(body?'<div class="agtxt">'+esc(body)+'</div>':'')
      +(chips.length?'<div class="sigs">'+chips.join('')+'</div>':'')
      +'</div></div></div>';
    s.iv.filter(v=>v.t>=t.t0&&v.t<=tEnd+0.5).forEach(v=>{
      const nx=s.turns[ix+1];
      if(nx&&nx.text===v.quote)skipMe=true;
      /* It used to say "reads as Gone dark". Gone dark is dead: round 1 scored
         it +59 pp, the truncation-matched control scored it -6 pp, and what it
         was measuring was the closing summary a cut-off turn does not have.
         What the run does support here is how deep into the turn he pressed. */
      const into=Math.max(0,v.t-t.t0);
      h+='<div class="turn" data-t="'+ix+'"><div class="full"><div class="cut" '+tipAttr(
        v.kind+' \u2014 you pressed escape and stopped it. This is the ground-truth negative the system gets for free. '
          +'No earned class reads this turn: the conduct run covered 12 sessions and this chat is not one of them.',
        v.hhmm+' \u00b7 '+v.depth+' assistant messages and '+dur(into)+' into the turn \u00b7 you spoke '+v.gap
          +' s later \u00b7 over 90 days, 22 of 46 escapes were Corrections and 24 were Nudges',
        'Nothing to do \u2014 you already did it. This press is what teaches the judge what wrong looks like.')
        +'><div class="rule"></div><div class="lab">Correction \u00b7 '+v.hhmm+' \u00b7 '+v.depth
        +' messages and '+dur(into)+' into the turn</div>'
        +'<div class="quote">\u201c'+esc(v.quote)+'\u201d</div></div></div></div>';
    });
    prevEnd=tEnd;
  });
  h+='</div>';
  scroll.innerHTML=h;
  const shown=fitConv(s.turns.length), n=s.turns.length;
  /* two windows, and the line says which is which: a Correction inside this log
     and a Correction from earlier today are not the same number. */
  const early=c.prior.filter(x=>x.quote&&x.kind==='Correction').length;
  $('#convmeta').textContent='you on the left, the agent on the right \u00b7 '+n+' turn'+(n===1?'':'s')
    +' since '+hhmm(c.firstT)+(shown<n?', the last '+shown+' below':'')
    +' \u00b7 '+s.corrections+' Correction'+(s.corrections===1?'':'s')+' in that window'
    +(early?' \u00b7 '+early+' earlier today':'');
}
function updateLive(p){
  const c=CHATS.find(x=>x.id===sel);
  /* a live duration or a growing row can wrap a line between full renders;
     refit rather than clip. A box is never cut in half. */
  if(scroll.scrollHeight>scroll.clientHeight+1){convKey='';renderConv(p,true);return;}
  const box=scroll.querySelector('.agbox.live');
  if(!box)return;
  const t=c.turns.filter(t=>t.t0<=p).pop();
  if(!t)return;
  const e=Math.max(0,p-t.t0);
  const el=box.querySelector('[data-el]'), ex=box.querySelector('[data-ext]');
  if(el)el.textContent=dur(e); if(ex)ex.style.width=extent(e).toFixed(0)+'px';
}

/* ---------------------------------------------------------------------------
   THE PARAMETERS — round 5, and the oldest thing on the owner's list:
   "I can see the events affecting those parameters."

   Three numbers this chat produced, drawn over the same twenty minutes as the
   Pulse, in the same left gutter, against the same five-minute gridlines, with
   the interventions carried through as the same rust rule. A turn, the press
   that stopped it, and the line that moved sit on one vertical.

   The three are the only per-event numbers the log actually holds for every
   chat: About to break something on every Bash call, Wants you at every stop,
   Says done at every stop and subagent return. The earned classes are NOT here
   on purpose — the conduct run scored twelve sessions on other days, so its
   turns have no place on today's axis, and a line drawn from nothing would be
   the fourth speculative series the critic warned about.

   Every mark is one reading of one event: a stem from the lane's own wire up to
   the number the judge returned, and a light line from each reading to the next.
   Nothing is held across a gap — an earlier draft carried the last value flat to
   the right edge, which drew a chat as still wanting you twenty minutes after it
   went back to work. A lane with one stem had one event. A lane with none had
   none, and its wire says so.
--------------------------------------------------------------------------- */
const PLANES=[
  {n:'About to break something', src:'every Bash call',
   hit:e=>e.k==='tool'&&e.a&&e.a.risky!=null, val:e=>e.a.risky, cmd:true,
   what:'a hook rule reads the command before it runs',
   act:'Decide before it runs. Today the board only notices.'},
  {n:'Wants you', src:'every stop',
   hit:e=>e.k==='stop'&&e.a&&e.a.needs_owner!=null, val:e=>e.a.needs_owner,
   what:'read from the last line of the turn, never judged',
   act:'Open this tab; it stopped on a question.'},
  {n:'Says done', src:'stops and subagent returns',
   hit:e=>(e.k==='stop'||e.k==='sub')&&e.a&&e.a.claims_done!=null, val:e=>e.a.claims_done,
   what:'read from the text; whether the claim was backed is the class, and no judge has earned it',
   act:'Ask for the number, the diff, the exit code.'}
];
function renderParams(p){
  const c=CHATS.find(x=>x.id===sel), host=$('#params');
  const W=host.clientWidth, H=host.clientHeight;
  if(W<40||H<40)return;
  /* the Pulse's own margins, so the two bands share one x */
  const ML=GUT, MR=10, X0=ML, X1=W-MR, t0=p-WIN;
  const xOf=t=>X0+(t-t0)/WIN*(X1-X0);
  const TOP=17, lh=(H-TOP-4)/PLANES.length;
  let g='';
  /* the Pulse's gridlines, at the same five minutes */
  const a0=T0+t0*1000, a1=T0+p*1000;
  for(let k=Math.ceil(a0/300000)*300000;k<=a1;k+=300000)
    g+='<line x1="'+xOf((k-T0)/1000).toFixed(1)+'" y1="0" x2="'+xOf((k-T0)/1000).toFixed(1)
      +'" y2="'+H+'" stroke="#EBE8DF" stroke-width="1"/>';

  PLANES.forEach((L,i)=>{
    const top=TOP+i*lh, base=top+lh-14, span=lh-22;
    const yOf=v=>base-Math.max(0,Math.min(1,v))*span;
    const all=c.events.filter(e=>L.hit(e)&&e.t<=p);
    const win=all.filter(e=>e.t>=t0);
    /* the wire, and the line it fires above */
    g+='<line x1="'+X0+'" y1="'+base.toFixed(1)+'" x2="'+X1+'" y2="'+base.toFixed(1)
      +'" stroke="#E5E3DC" stroke-width="1"/>'
      +'<line x1="'+X0+'" y1="'+yOf(.5).toFixed(1)+'" x2="'+X1+'" y2="'+yOf(.5).toFixed(1)
      +'" stroke="rgba(107,107,104,.30)" stroke-width="1" stroke-dasharray="2 4"/>';
    /* the name straddles its own wire, the way the Pulse's chat names sit on theirs */
    g+='<text x="'+(ML-10)+'" y="'+(base-4).toFixed(1)+'" text-anchor="end" font-family="'+SANS
      +'" font-size="10" fill="#6B6B68">'+esc(L.n)+'</text>'
      +'<text x="'+(ML-10)+'" y="'+(base+7).toFixed(1)+'" text-anchor="end" font-family="'+MONO
      +'" font-size="9" fill="rgba(107,107,104,.8)">'+esc(L.src)+'</text>';
    if(win.length){
      /* one stem per reading, from the wire to the number the judge returned */
      let d='';
      win.forEach((e,k)=>{const v=L.val(e), x=xOf(e.t), y=yOf(v);
        g+='<line x1="'+x.toFixed(1)+'" y1="'+base.toFixed(1)+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)
          +'" stroke="'+(v>=.5?'rgba(166,71,43,.45)':'rgba(20,20,19,.20)')+'" stroke-width="1"/>';
        d+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});
      if(win.length>1)g+='<path d="'+d+'" fill="none" stroke="rgba(20,20,19,.32)" stroke-width="1"/>';
      win.forEach(e=>{const v=L.val(e);
        g+='<circle cx="'+xOf(e.t).toFixed(1)+'" cy="'+yOf(v).toFixed(1)+'" r="'
          +(v>=.5?3.2:2.2)+'" fill="'+(v>=.5?'rgba(166,71,43,.88)':'rgba(20,20,19,.48)')+'"/>';});
      /* One number per lane, and it is the one that matters: the highest the
         judge read in this window. It is parked in the lane's top-left corner —
         the oldest time at the highest value, which is the one region of a lane
         that data does not reach. Printed beside its own mark it was struck
         through by its own line whenever the chat was busy. */
      const hiV=Math.max.apply(null,win.map(L.val));
      const busyLeft=win.some(e=>xOf(e.t)<X0+150&&L.val(e)>=.55);
      g+='<text x="'+(busyLeft?X1:X0+6)+'" y="'+(top+10).toFixed(1)+'" text-anchor="'
        +(busyLeft?'end':'start')+'" font-family="'+MONO
        +'" font-size="10" fill="'+(hiV>=.5?'rgba(166,71,43,.74)':'#6B6B68')+'">highest '
        +hiV.toFixed(2)+'</text>';
    } else {
      /* the same corner the reading uses, so the lane always says something in
         one place — and clear of its own fire line */
      g+='<text x="'+(X0+6)+'" y="'+(top+10).toFixed(1)+'" font-family="'+SANS
        +'" font-size="10" fill="rgba(107,107,104,.75)">'
        +(all.length?'nothing to read in this window — last was '+esc(hhmm(all[all.length-1].t))
                    :'nothing to read here today')+'</text>';
    }
    const fired=all.filter(e=>L.val(e)>=.5).length, hi=win.length?Math.max.apply(null,win.map(L.val)):null;
    g+='<rect x="'+X0+'" y="'+top.toFixed(1)+'" width="'+(X1-X0)+'" height="'+lh.toFixed(1)
      +'" fill="transparent" '+tipAttr(L.n+' — '+L.what+'. Every stem is one reading of one event, at the moment the event happened. Nothing is carried across a gap.',
        all.length+' reading'+(all.length===1?'':'s')+' in '+c.name+' today, '+fired+' over 0.50 · '
          +win.length+' in this 20-minute window'+(hi!=null?', highest '+hi.toFixed(2):''),
        L.act)+'></rect>';
  });

  /* the turns, on the same verticals as the Pulse above */
  c.events.filter(e=>e.t>=t0&&e.t<=p&&(e.k==='user'||e.k==='stop')).forEach(e=>{
    g+='<line x1="'+xOf(e.t).toFixed(1)+'" y1="2" x2="'+xOf(e.t).toFixed(1)+'" y2="12" stroke="'
      +(e.k==='user'?'#D97757" stroke-width="2':'rgba(20,20,19,.55)" stroke-width="1.4')+'"/>';});

  /* GEAR 1: the intervention, carried down from the Pulse as the same rule */
  c.iv.filter(v=>v.t>=t0&&v.t<=p).forEach(v=>{const x=xOf(v.t);
    g+='<line x1="'+x.toFixed(1)+'" y1="0" x2="'+x.toFixed(1)+'" y2="'+H+'" stroke="#A6472B" stroke-width="3"/>'
      +'<text x="'+(x-6).toFixed(1)+'" y="10" text-anchor="end" font-family="'+SANS
      +'" font-size="9.5" fill="#A6472B">'+esc(v.kind+' '+v.hhmm.slice(0,5))+'</text>'
      +'<rect x="'+(x-7).toFixed(1)+'" y="0" width="14" height="'+H+'" fill="transparent" '
      +tipAttr(v.kind+' — you pressed escape and stopped it. Everything to the right of this rule happened after you did.',
        v.hhmm+' · '+v.depth+' assistant messages in · you spoke '+v.gap+' s later: “'+v.quote+'”',
        'Nothing to do — you already stopped it.')+'></rect>';});

  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+g+'</svg>';
  $('#paramtitle').textContent='Parameters — '+c.name;
  $('#parammeta').textContent='the same twenty minutes as the Pulse, on the same axis · '
    +'every reading 0 to 1, the dashes are 0.50, where a signal fires';
}

/* ---------- numbers ---------- */
/* ---------------------------------------------------------------------------
   THE VERDICT — the answer, drawn before any of the evidence for it.
   It used to sit at the bottom edge, quieter than the band titles above it.
--------------------------------------------------------------------------- */
/* ROUND 5 — the headline counts the day, not the log.
   It used to count only the Corrections inside this log and then print
   "1 Correction" directly above a Correction block from 17:10 and a meta line
   reading "1 earlier today". Two on screen, one in the headline. The day total
   now includes the ones that happened before the log opens, and the tooltip
   says which is which. */
function priorCorrections(c){return (c.prior||[]).filter(x=>x.quote&&x.kind==='Correction').length;}
function renderVerdict(p){
  let tc=0,inLog=0,early=0,tr=0,trN=0,te=0,live=0,cleanN=0,runs=0,wants=[],where=[];
  CHATS.forEach(x=>{const y=snap(x,p);if(y.i<0)return;runs++;
    const pc=priorCorrections(x), all=y.corrections+pc;
    tc+=all;inLog+=y.corrections;early+=pc;
    y.iv.filter(v=>v.kind==='Correction').forEach(v=>where.push(v.hhmm+' '+x.name+', in this log'));
    (x.prior||[]).filter(q=>q.quote&&q.kind==='Correction').forEach(q=>where.push(q.hhmm+' '+x.name+', earlier today'));
    const rk=todayRisky(x,p);tr+=rk.f;trN+=rk.n;
    te+=y.i+1;if(y.state!=='Quiet')live++;if(all===0)cleanN++;
    if(y.state==='Wants you')wants.push(x);});
  const day='<span class="vsent" '+tipAttr(
      'The whole day in one line: how many chats ran, how many times you had to stop one, and how many needed nothing from you. Today counts everything since you woke the first chat, not only what is inside this log.',
      where.sort().join(' · ')+' · '+cleanN+' of '+runs+' chats with zero Corrections = '
        +Math.round(100*cleanN/Math.max(1,runs))+'% · over 90 days it was 5 of 44',
      tc?'Read what you said next; that is the class.':'Nothing.')+'>'
    +'<b>'+runs+'</b> <span class="w">chats</span> · <b>'+tc+'</b> <span class="w">Correction'
    +(tc===1?'':'s')+'</span> · <b>'+cleanN+' of '+runs+'</b> <span class="w">clean runs</span></span>';

  /* TOP GEAR. The one state that asks for the owner takes the top line and the
     only filled accent on the board. Everything else is ink or grey. */
  let h='';
  if(wants.length){
    const nm=wants.map(x=>x.name).join(', ');
    h+='<div class="vline vwants" '+tipAttr(
        (wants.length===1?nm+' stopped and its last line asks you something.':wants.length+' chats stopped on a question.')
          +' Wants you is read from the text, never judged — when an agent needs you it says so.',
        wants.map(x=>x.name+' · '+x.project+' · stopped '+clockOf(snap(x,p).since)).join('  |  '),
        'Open '+(wants.length===1?'this tab':'them')+'; nothing else on this board needs you.')
      +'><span class="blk"></span>'+esc(nm)+(wants.length===1?' wants you':' want you')+'</div>'
      +'<div class="vsmall">'+day+'</div>';
  } else {
    h+='<div class="vline">'+day+'</div>';
  }
  /* CUT in round 5: judge 965 ms and cost $0.014. Latency is a build fact and
     cost is a footnote the owner has said he does not read. */
  h+='<div class="vfine">'
    +'<span class="lab">'+(early?'today, every chat · '+inLog+' Correction'+(inLog===1?'':'s')
        +' in this log, '+early+' earlier':'today, every chat, since the first event at 19:14')+'</span>'
    +'<span '+tipAttr('About to break something, fired, across every chat today. A hook rule over the command text — not one of the nine conduct classes.',
        tr+' fired of '+trN+' Bash calls judged before they ran = '+(trN?Math.round(100*tr/trN):0)+'%',
        'Phase 3 asks before it runs; today it only notices.')+'><b>'+tr+'</b> near misses of '+trN+' Bash calls</span>'
    +'<span '+tipAttr('Every hook event the judge answered today.',te+' of '+META.nEvents+' events in the log, up to '+clockOf(p),'Nothing.')
      +'><b>'+te+'</b> events</span>'
    +'</div>';
  $('#verdict').innerHTML=h;
  return tc;
}

/* ---------------------------------------------------------------------------
   ONE chat, ONE window, and every number carries its own denominator and unit.
   "Clean run Yes/No" is cut: it restated Corrections, and it was the number
   that contradicted Near misses standing beside it.
--------------------------------------------------------------------------- */
function renderNums(p){
  const c=CHATS.find(x=>x.id===sel), s=snap(c,p);
  const rk=todayRisky(c,p), claimsN=judgedUpTo(c,p,'claims_done');
  /* ROUND 5: this number counts the chat's whole day too, so it cannot disagree
     with the headline or with the Correction block sitting above it. */
  const pc=priorCorrections(c), corr=s.corrections+pc;
  const corrM=pc&&s.corrections?s.corrections+' since '+hhmm(c.firstT)+', '+pc+' earlier today'
    :pc?pc+' earlier today, none since '+hhmm(c.firstT)
    :'of '+s.turns.length+' turn'+(s.turns.length===1?'':'s')+' since '+hhmm(c.firstT);
  const stats=[
    [corr,'Correction'+(corr===1?'':'s'),corrM,corr>0?'alert':false,
     'A Correction is an escape whose next message is a complaint. It is the hero number and the one label the system gets for free. This counts the chat’s whole day, the same as the headline.',
     corr+' today · '+s.corrections+' of '+s.turns.length+' turns since '+hhmm(c.firstT)
       +(pc?' · '+pc+' before this log opened':'')
       +' · a Nudge does not count: over 90 days, 24 of 46 escapes were Nudges',
     corr?'Read what you said next; that is the class.':'Nothing.'],
    [rk.f,'Near miss'+(rk.f===1?'':'es'),'of '+rk.n+' Bash call'+(rk.n===1?'':'s')+' judged',rk.f>0?'warn':false,
     'About to break something: a hook rule reads the command before it runs. It says nothing about conduct — it is not one of the nine classes.',
     rk.f+' fired of '+rk.n+' Bash calls judged in this chat = '+(rk.n?Math.round(100*rk.f/rk.n):0)+'%',
     rk.f?'Nothing today — the board only notices. Phase 3 asks first.':'Nothing.'],
    [s.turns.length,'Turns','of '+(s.i+1)+' event'+(s.i===0?'':'s')+', since '+hhmm(c.firstT),false,
     'A turn is one exchange: your message, then what the agent did until it stopped.',
     s.turns.filter(t=>t.kind==='owner').length+' opened by you · '+s.stop+' closed by a stop · '
       +s.tool+' tool calls, '+s.sub+' subagent returns',
     'Nothing.'],
    [s.claims,'Claims of done','of '+claimsN+' stop'+(claimsN===1?'':'s')+' and returns',false,
     'It stated an outcome. Free, read from the text. Whether the claim was backed is the class, and no judge has earned it — 0 of 19 corrections were about an unbacked claim.',
     s.claims+' of '+claimsN+' stops and subagent returns in this chat',
     'Ask for the number, the diff, the exit code.']
  ];
  /* CUT in round 5: the four numerals at headline scale. The numbers stay, at
     reading size, on the row under the strip that plots them. */
  $('#stats').innerHTML=stats.map(a=>'<div class="stat" '+tipAttr(a[4],a[5],a[6])+'>'
    +'<div><span class="v'+(a[3]?' '+a[3]:'')+'">'+esc(a[0])+'</span><span class="k">'+a[1]+'</span></div>'
    +'<div class="m">'+a[2]+'</div></div>').join('');
  $('#statstitle').textContent='The same chat, counted · each number names its own window';

  /* --- what the judge has earned: two of nine, with the measurement on them --- */
  const e=earnedIn(c,p);
  $('#classwin').textContent='· two of nine questions';
  $('#earned').innerHTML=EARNED.map(cl=>{
    const here=!e?'none scored here'
      : cl.j ? e.jumped+' of '+e.n+' scored here'
             : (e.wrong+' of '+e.n+' scored here');
    return '<div class="erow" '+tipAttr(
        cl.n+' — '+cl.means+'. '+(cl.j
          ? 'The only question whose lift grew under matching, and the only complaint in the corpus that is his alone.'
          : 'The model version of this one fired on 89% of everything. Comparing paths touched against paths named works.'),
        'fires on '+cl.corr+'% of '+JEVM.corrections+' corrections and '+cl.clean+'% of '+JEVM.matched
          +' matched clean turns = '+cl.lift+' · paired win '+cl.win.toFixed(2)+' · fires at 0.50 · '+here,
        cl.act)
      +'><div class="e1"><span class="en">'+cl.n+'</span><span class="ekind">'+cl.kind
      +'</span><span class="elift">'+cl.lift+'</span></div>'
      +'<div class="e2">'+cl.corr+'% of '+JEVM.corrections+' corrections vs '+cl.clean+'% of '
      +JEVM.matched+' matched clean turns · '+here+'</div></div>';
  }).join('');

  /* CUT in round 5: two paragraphs became one line, and neither meaning went
     with them — seven more named and unearned, neither of these two may act,
     and what would earn it. */
  let tc=0;CHATS.forEach(x=>{const y=snap(x,p);if(y.i>=0)tc+=y.corrections+priorCorrections(x);});
  $('#trust').innerHTML='<span '+tipAttr(
    'Seven more questions are named in docs/signals.md and none survived the truncation-matched control, so none is on this board. Trust is the other gate: when the judge says 0.8, is it right 8 times in 10? Every Correction you make labels one fire for free.',
    NOT_EARNED.map(x=>x[0]+' '+x[1]+' — '+x[2]).join('  |  ')
      +'  |  two more cannot be measured from a transcript at all: Ignoring the rules, Burning money'
      +'  |  today’s log gives '+tc+' free negative'+(tc===1?'':'s')+', the conduct run had '+JEVM.corrections,
    'Nothing yet. Do not read a class that is not here.')
    +'>Seven more questions, none earned. Neither may act until its curve tracks you: '
    +JEVM.corrections+' labels, about 20 needed.</span>';
}

/* ---------------------------------------------------------------------------
   TOOLTIP — FOURTH ATTEMPT, and the mechanism changes rather than the offsets.
   Three rounds of moving the panel failed for the same reason each time: a
   panel of prose sitting near several elements says nothing about which one it
   explains. So the board now does three things at once:
     1. the ground DIMS to var(--paper) at .80 — the cream does not change
        colour, every mark on it recedes to a fifth of its strength;
     2. the subject is RAISED above the scrim at full strength, so it is the one
        bright thing on the board besides the panel;
     3. a LEADER runs from the panel's near edge to the subject's near edge and
        ends in a dot on the subject.
   Placement still avoids the subject and the rail, but placement is no longer
   the thing doing the work. An SVG mark raises its whole strip, and the leader
   points at the lane.
--------------------------------------------------------------------------- */
const tipEl=$('#tip'), scrimEl=$('#scrim'), leadEl=$('#leader'),
      leadLine=$('#leaderline'), leadDot=$('#leaderdot');
let subEl=null;
function dropSub(){if(subEl){subEl.classList.remove('tipsub');subEl.style.position='';subEl=null;}}
document.addEventListener('mousemove',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-tip]'):null;
  if(!el){tipEl.style.opacity=0;scrimEl.classList.remove('on');
    leadEl.classList.remove('on');dropSub();return;}
  const a=el.getAttribute('data-tip').split('|');
  tipEl.children[0].textContent=a[0]||'';
  tipEl.children[1].textContent=a[1]||'';
  tipEl.children[2].textContent=a[2]||'';
  const RAILR=document.querySelector('.rail').getBoundingClientRect().right;
  const r=el.getBoundingClientRect(), w=286, h=tipEl.offsetHeight||90;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const LEFT=RAILR+12, RIGHT=1432;
  let x,y;
  if(r.left<RAILR){                       /* the subject is a rail row */
    x=LEFT;y=cl(r.top-2,8,892-h);
  } else if(r.right+14+w<=RIGHT){         /* beside it, to the right */
    x=r.right+14;y=cl(r.top-2,8,892-h);
  } else if(r.left-14-w>=LEFT){           /* beside it, to the left, clear of the rail */
    x=r.left-w-14;y=cl(r.top-2,8,892-h);
  } else if(r.bottom+12+h<=892){          /* under it, flush to its left edge */
    x=cl(r.left,LEFT,RIGHT-w);y=r.bottom+12;
  } else {                                /* above it, flush to its left edge */
    x=cl(r.left,LEFT,RIGHT-w);y=cl(r.top-h-12,8,892-h);
  }
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.style.opacity=1;
  /* raise the subject. An SVG mark cannot be raised on its own, so its strip is. */
  const raise=el.ownerSVGElement?el.ownerSVGElement.parentNode:el;
  if(raise!==subEl){dropSub();subEl=raise;raise.classList.add('tipsub');
    if(getComputedStyle(raise).position==='static')raise.style.position='relative';}
  scrimEl.classList.add('on');
  /* the leader: the shortest line between the two rectangles, ending in a dot
     on the subject. Shortest means it never crosses anything it does not have
     to, and it is never ambiguous about which mark it lands on. */
  const rr=el.getBoundingClientRect();
  const pc={x:x+w/2,y:y+h/2};
  const sx=cl(pc.x,rr.left+2,rr.right-2), sy=cl(pc.y,rr.top+2,rr.bottom-2);
  const px=cl(sx,x,x+w), py=cl(sy,y,y+h);
  leadLine.setAttribute('d','M'+px.toFixed(1)+' '+py.toFixed(1)+'L'+sx.toFixed(1)+' '+sy.toFixed(1));
  leadDot.setAttribute('cx',sx.toFixed(1));leadDot.setAttribute('cy',sy.toFixed(1));
  leadEl.classList.add('on');
});

/* ---------- loop ---------- */
let lastPulse=0,lastSlow=0;
/* The conversation's ceiling is whatever the other four rows do not need, with
   a floor left for the parameter strip. Fixed in CSS it was either too short for
   a busy chat or it reopened the void under a quiet one. */
const PARAMS_MIN=126;
let lastCap=0;
function setConvCap(){
  const main=document.querySelector('.main'), v=$('#verdict').getBoundingClientRect().height;
  const cap=Math.round(main.getBoundingClientRect().height-4*12-112-150-v-PARAMS_MIN);
  if(cap!==lastCap){lastCap=cap;document.querySelector('.band.conv').style.maxHeight=cap+'px';}
}
function render(force){renderVerdict(playhead);setConvCap();renderRail(playhead);
  renderConv(playhead,force);renderParams(playhead);renderNums(playhead);}
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(playing){playhead+=dt*RATE;if(playhead>LOOP1)playhead=LOOP0;}
  $('#clock').textContent=clockOf(playhead);
  $('#prog').style.width=(150*(playhead-LOOP0)/(LOOP1-LOOP0)).toFixed(1)+'px';
  if(now-lastPulse>45){lastPulse=now;
    Plotly.relayout('pulse',{'xaxis.range':[X(playhead-WIN),X(playhead)]});}
  if(now-lastSlow>220){lastSlow=now;render(false);} else updateLive(playhead);
  requestAnimationFrame(frame);
}
$('#restart').addEventListener('click',()=>{playhead=START;convKey='';render(true);});
updateLane();render(true);
requestAnimationFrame(now=>{last=now;frame(now);});
const _sel=sel;Object.defineProperty(window,'setChat',{value:id=>{sel=id;convKey='';updateLane();render(true);}});
</script>
</body></html>
