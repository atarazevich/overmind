        +(sys?' sys':'')+'" '+tipAttr(
          (sys?(t.kind==='agent-report'?'A background agent returned into this chat.':'A command you ran in this chat.')
              :'Your message at '+clockOf(t.t0)+'. It opened a turn that ran '+dur(tEnd-t.t0)+'.')
            +(t.kind==='owner'?' \u201c'+trunc(t.text,200)+'\u201d':''),
          clockOf(t.t0)+' \u00b7 that turn made '+R.tools+' tool calls and took '+R.subs+' subagent returns'
            +(t.sharp!=null?' \u00b7 sharp turn '+t.sharp.toFixed(2)+', a marker, not an alarm':''),
          t.kind==='owner'?'Nothing. This one is you.':'Nothing.')
        +'><div class="who">'+(t.kind==='owner'?'You':t.kind==='agent-report'?'Background agent':'You \u00b7 command')
        +'<span>'+clockOf(t.t0).slice(0,5)+'</span></div>'
        +'<div class="txt">'+esc(trunc(t.text,230))+'</div></div></div>';
    }
    skipMe=false;
    const sil=longestSilence(c,t.t0,tEnd);
    const chips=[];
    if(R.risky.length)chips.push('<span class="sig" '+tipAttr(
      'About to break something \u2014 '+R.risky.length+' command'+(R.risky.length===1?'':'s')+' in this turn '+(R.risky.length===1?'is':'are')+' hard to undo.',
      R.risky.map(r=>clockOf(r.t)+' '+r.p.toFixed(2)+' '+trunc(r.cmd,46)).slice(0,3).join(' \u00b7 '),
      'Decide before it runs. Today the board only notices.')+'>About to break something \u00d7'+R.risky.length+'</span>');
    const J=jevFor(c,t.t0,tEnd,t.kind);
    if(J){
      const ks=Object.keys(J.sc).filter(k=>JNAME[k]&&J.sc[k]>=.5).sort((a,b)=>J.sc[b]-J.sc[a]);
      ks.slice(0,4).forEach(k=>{const cl=JNAME[k];
        chips.push('<span class="sig" '+tipAttr(cl.n+' \u2014 '+cl.means+'.',
          'judge '+J.sc[k].toFixed(2)+' on this turn, over the 0.50 line \u00b7 '+J.msgs+' assistant messages, '
            +J.tools+' tool calls \u00b7 scored in the conduct run, '+JEVM.model,
          cl.act)+'>'+cl.n+' '+J.sc[k].toFixed(2)+'</span>');});
      if(ks.length>4)chips.push('<span class="sig q" '+tipAttr(
        (ks.length-4)+' more classes fired on this turn.',
        ks.slice(4).map(k=>JNAME[k].n+' '+J.sc[k].toFixed(2)).join(' \u00b7 '),
        'Read the first upstream one; the rest are downstream symptoms.')+'>+'+(ks.length-4)+' more</span>');
    }
    if(!J&&stop&&(stop.drifting||0)>=.5)chips.push('<span class="sig" '+tipAttr(
      'Doing too much \u2014 it did more than you asked.',
      'judge '+stop.drifting.toFixed(2)+' at the stop, over the 0.50 line \u00b7 13 of 31 stops fired today',
      'Pull it back.')+'>Doing too much '+stop.drifting.toFixed(2)+'</span>');
    if(stop&&(stop.needs_owner||0)>=.5)chips.push('<span class="sig q" '+tipAttr(
      'It stopped on a question. Not a class \u2014 a free fact, read from the text.',
      'today the log carries it as a judge answer, '+stop.needs_owner.toFixed(2)+'; the shipped version reads it instead of asking',
      'Open this tab.')+'>Wants you</span>');
    if(stop&&(stop.claims_done||0)>=.5)chips.push('<span class="sig q" '+tipAttr(
      'It said it was done. Also a free fact, not a class.',
      'says done '+stop.claims_done.toFixed(2)+' \u00b7 whether the claim was backed is the class, and no judge is wired for it',
      'Ask for the number, the diff, the exit code.')+'>Says done</span>');
    const body=live?'':trunc(t.agentEnd||t.agent,140);
    h+='<div class="turn" data-t="'+ix+'"><span class="mark'+meMark+'"></span>'+meCell+'<div class="agcell">'
      +'<div class="agbox'+(live?' live':'')+'" '+tipAttr(
        'An agent turn in '+c.name+': '+(live?'running for ':'it ran for ')+dur(tEnd-t.t0)+' and made '+R.tools+' tool call'+(R.tools===1?'':'s')+'.',
        clockOf(t.t0)+' \u2192 '+(live?'now':clockOf(tEnd))+' = '+Math.round(tEnd-t.t0)+' s \u00b7 '+t.tools
          +' Bash calls, '+t.subs+' subagent returns \u00b7 longest stretch with no event '+dur(sil),
        R.risky.length?'Look at the '+R.risky.length+' flagged command'+(R.risky.length===1?'':'s')+' before it runs another.'
          :sil>240?'Ask for status; you had no sign of life for '+dur(sil)+'.':'Nothing.')+'>'
      +'<div class="agmeta"><span>'+(t.kind==='resume'?(R.tools===0&&R.subs?'Background agent':'Agent, already running'):'Agent')+'</span>'
      +(tiny?'<span>returned at '+clockOf(tEnd)+'</span>'
        :'<span class="ext" data-ext style="width:'+extent(tEnd-t.t0).toFixed(0)+'px"></span>'
         +'<span data-el>'+dur(tEnd-t.t0)+'</span><span data-tc>'+R.tools+' tool call'+(R.tools===1?'':'s')+'</span>')
      +(R.subs?'<span>'+R.subs+' subagent'+(R.subs===1?'':'s')+'</span>':'')
      +(live?'<span style="color:#D97757">running</span>':'')
      +(t.queuedNote?'<span>you queued the next one</span>':'')+'</div>'
      +(body?'<div class="agtxt">'+esc(body)+'</div>':'')
      +(chips.length?'<div class="sigs">'+chips.join('')+'</div>':'')
      +'</div></div></div>';
    s.iv.filter(v=>v.t>=t.t0&&v.t<=tEnd+0.5).forEach(v=>{
      const nx=s.turns[ix+1];
      if(nx&&nx.text===v.quote)skipMe=true;
      h+='<div class="turn" data-t="'+ix+'"><div class="full"><div class="cut" '+tipAttr(
        v.kind+' \u2014 you pressed escape and stopped it. This is the ground-truth negative the system gets for free.',
        v.hhmm+' \u00b7 '+v.depth+' assistant messages in \u00b7 you spoke '+v.gap+' s later \u00b7 over 90 days, 22 of 46 escapes were Corrections and 24 were Nudges',
        'Nothing to do \u2014 you already did it. This press is what teaches the judge what wrong looks like.')
        +'><div class="rule"></div><div class="lab">Correction \u00b7 '+v.hhmm+' \u00b7 '+v.depth
        +' messages in \u00b7 reads as Gone dark</div>'
        +'<div class="quote">\u201c'+esc(v.quote)+'\u201d</div></div></div></div>';
    });
    prevEnd=tEnd;
  });
  h+='</div>';
  scroll.innerHTML=h;
  const shown=fitConv(s.turns.length), n=s.turns.length;
  $('#convmeta').textContent='you on the left, the agent on the right \u00b7 '+n+' turn'+(n===1?'':'s')+' today'
    +(shown<n?', the last '+shown+' below':'')
    +' \u00b7 '+s.corrections+' Correction'+(s.corrections===1?'':'s');
}
function updateLive(p){
  const c=CHATS.find(x=>x.id===sel);
  const box=scroll.querySelector('.agbox.live');
  if(!box)return;
  const t=c.turns.filter(t=>t.t0<=p).pop();
  if(!t)return;
  const e=Math.max(0,p-t.t0);
  const el=box.querySelector('[data-el]'), ex=box.querySelector('[data-ext]');
  if(el)el.textContent=dur(e); if(ex)ex.style.width=extent(e).toFixed(0)+'px';
}

/* ---------- numbers ---------- */
function renderNums(p){
  const c=CHATS.find(x=>x.id===sel), s=snap(c,p);
  const stats=[
    ['Corrections',s.corrections,'times you stopped it because it was going wrong',s.corrections>0,
     'A Correction is an escape whose next message is a complaint. It is the hero number and the one free label.',
     s.corrections+' correction'+(s.corrections===1?'':'s')+' in '+s.turns.length+' turns so far in '+c.name,
     s.corrections?'Read what you said next; that is the class.':'Nothing.'],
    ['Clean run',s.corrections===0?'Yes':'No','a run you never had to correct',s.corrections>0,
     'Clean run: the whole session so far without a single Correction.',
     s.corrections+' corrections · '+s.turns.length+' turns · '+s.tool+' tool calls · verdict '+(s.corrections===0?'clean':'not clean'),
     s.corrections===0?'Nothing. Two consecutive clean runs is what promotes a capability to trusted.':'Nothing yet.'],
    ['Near misses',s.risky,'About to break something, fired',s.risky>0,
     'Near misses: commands the judge called hard or impossible to undo, before they ran.',
     s.risky+' fired of '+judgedUpTo(c,p,'risky')+' Bash calls judged in this chat = '
       +(judgedUpTo(c,p,'risky')?Math.round(100*s.risky/judgedUpTo(c,p,'risky')):0)+'%',
     s.risky?'Nothing today — the board only notices. Phase 3 asks first.':'Nothing.'],
    ['Turns',s.turns.length,'messages and agent turns, this chat',false,
     'A turn is one exchange: your message, then what the agent did until it stopped.',
     s.turns.filter(t=>t.kind==='owner').length+' opened by you · '+s.stop+' closed by a stop · '
       +s.tool+' tool calls across all of them',
     'Nothing.'],
    ['Claims made',s.claims,'free fact, read from the text',false,
     'It stated an outcome. Whether the claim was backed is the class, and no judge is wired for it yet.',
     s.claims+' claims of '+judgedUpTo(c,p,'claims_done')+' stops and subagent returns in this chat',
     'Ask for the number, the diff, the exit code.']
  ];
  $('#stats').innerHTML=stats.map(a=>'<div class="stat" '+tipAttr(a[4],a[5],a[6])+'>'
    +'<div class="v'+(a[3]?' alert':'')+'">'+esc(a[1])+'</div><div class="k">'+a[0]+'</div>'
    +'<div class="m">'+a[2]+'</div></div>').join('');

  let tc=0,tr=0,tt=0,te=0,live=0,cleanN=0,runs=0;
  CHATS.forEach(x=>{const y=snap(x,p);if(y.i<0)return;runs++;tc+=y.corrections;tr+=y.risky;
    tt+=y.turns.length;te+=y.i+1;if(y.state!=='Quiet')live++;if(y.corrections===0)cleanN++;});
  const tok=Math.round(META.tokens*te/META.nEvents);
  /* the sentence he says out loud; the band title says it is today, every chat */
  $('#today').innerHTML=
    '<span '+tipAttr('Every session the hook has seen today.','6 sessions in the log · '+live+' not yet quiet at '+clockOf(p),'Nothing.')+'><b>'+runs+'</b> chats</span>'
    +' · <span '+tipAttr('Corrections across every chat today.','1 escape in this log window was followed by a complaint; across 90 days it is 22 of 46','Read what you said next; that is the class.')+'><b>'+tc+'</b> Correction'+(tc===1?'':'s')+'</span>'
    +' · <span '+tipAttr('Runs you never had to correct.',cleanN+' of '+runs+' chats with zero Corrections = '+Math.round(100*cleanN/Math.max(1,runs))+'% · over 90 days it was 5 of 44','Nothing.')+'><b>'+cleanN+' of '+runs+'</b> clean runs</span>';
  $('#fine').innerHTML=
    '<span '+tipAttr('About to break something, fired, across every chat today.',tr+' fired of '+te+' events seen so far today','Phase 3 asks before it runs; today it only notices.')+'><b>'+tr+'</b> near misses</span>'
    +'<span '+tipAttr('Every hook event the judge answered today.',te+' of '+META.nEvents+' events in the log, up to '+clockOf(p),'Nothing.')+'><b>'+te+'</b> events</span>'
    +'<span '+tipAttr('How long the judge takes to answer.','jev-1.13.0 · p50 965 ms, p90 1080 ms across '+META.nEvents+' calls','Nothing. It runs beside the agent, not in front of it.')+'>judge <b>965 ms</b></span>'
    +'<span class="foot" '+tipAttr('What watching cost. A footnote: the owner does not care about it.',tok.toLocaleString()+' input tokens × $0.042/M = $'+(tok*0.042/1e6).toFixed(3),'Nothing.')+'>cost $'+(tok*0.042/1e6).toFixed(3)+'</span>';
  $('#statstitle').textContent=c.name+' · this chat, since '+hhmm(c.firstT);
  $('#classwin').textContent='this chat, since '+hhmm(c.firstT);

  $('#cgrid').innerHTML=CLASSES.map(cl=>{
    const cc=classCount(cl,c,p);
    if(!cc){
      const why=cl.nm?(JEVM.notMeasurable&&JEVM.notMeasurable[cl.nm])||'not measurable from the transcript'
        :'this chat was not in the conduct run: '+JEVM.sessions+' sessions, '+JEVM.turns+' agent turns scored';
      return '<div class="crow2 off" '+tipAttr(cl.n+' \u2014 '+cl.means+'.',why,
        cl.nm?'Nothing yet. It needs the rules that were in context, as state.':'Nothing yet. This chat has no scored turns.')
        +'><span class="cn">'+cl.n+'</span><span class="cv">\u2014</span></div>';
    }
    const pct=cc.n?Math.round(100*cc.f/cc.n):0;
    return '<div class="crow2'+(cc.f?' hit':'')+'" '+tipAttr(cl.n+' \u2014 '+cl.means+'.',
      cc.src==='run'
        ? cc.f+' fired of '+cc.n+' agent turns scored in '+c.name+' today = '+pct+'% \u00b7 fires at 0.50 \u00b7 conduct run, '+JEVM.model
        : cc.f+' fired of '+cc.n+' judged in '+c.name+' = '+pct+'% \u00b7 live log key "'+cl.k+'"',
      cl.act)+'><span class="cn">'+cl.n+'</span><span class="cv">'+cc.f+'/'+cc.n+'</span></div>';
  }).join('');
  $('#trust').innerHTML='<span '+tipAttr('Trust — when the judge says 0.8, is it right 8 times in 10?',
    'the curve needs about 20 labelled fires per class; today’s log gives '+tc+' free negative'+(tc===1?'':'s'),
    'Nothing yet. Every Correction you make labels one for free.')
    +'>Trust — this judge has not earned yours yet. Every Correction labels one fire for free, and about 20 per class draw the curve. Today gave '+tc+'.</span>';
}

/* ---------- tooltip ---------- */
const tipEl=$('#tip');
document.addEventListener('mousemove',ev=>{
  const el=ev.target.closest?ev.target.closest('[data-tip]'):null;
  if(!el){tipEl.style.opacity=0;return;}
  const a=el.getAttribute('data-tip').split('|');
  tipEl.children[0].textContent=a[0]||'';
  tipEl.children[1].textContent=a[1]||'';
  tipEl.children[2].textContent=a[2]||'';
  /* placed against the box it explains, never on top of it: beside it when
     there is room, otherwise under it, otherwise above it */
  const r=el.getBoundingClientRect(), w=302, h=tipEl.offsetHeight||90;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  let x,y;
  if(r.right+14+w<=1432){x=r.right+14;y=cl(r.top-2,8,892-h);}
  else if(r.left-14-w>=8){x=r.left-w-14;y=cl(r.top-2,8,892-h);}
  else if(r.bottom+12+h<=892){x=cl(ev.clientX-w/2,8,1432-w);y=r.bottom+12;}
  else {x=cl(ev.clientX-w/2,8,1432-w);y=cl(r.top-h-12,8,892-h);}
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';tipEl.style.opacity=1;
});

/* ---------- loop ---------- */
let lastPulse=0,lastSlow=0;
function render(force){renderRail(playhead);renderConv(playhead,force);renderNums(playhead);}
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  if(playing){playhead+=dt*RATE;if(playhead>LOOP1)playhead=LOOP0;}
  $('#clock').textContent=clockOf(playhead);
  $('#prog').style.width=(150*(playhead-LOOP0)/(LOOP1-LOOP0)).toFixed(1)+'px';
  if(now-lastPulse>45){lastPulse=now;
    Plotly.relayout('pulse',{'xaxis.range':[X(playhead-WIN),X(playhead)]});}
  if(now-lastSlow>220){lastSlow=now;render(false);} else updateLive(playhead);
  requestAnimationFrame(frame);
}
$('#restart').addEventListener('click',()=>{playhead=START;convKey='';render(true);});
updateLane();render(true);
requestAnimationFrame(now=>{last=now;frame(now);});
const _sel=sel;Object.defineProperty(window,'setChat',{value:id=>{sel=id;convKey='';updateLane();render(true);}});
</script>
</body></html>
