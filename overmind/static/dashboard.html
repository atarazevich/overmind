<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overmind</title>
<!--
  The live dashboard. Design contract: docs/design/prototypes/dashboard-v3.html (9987892); copy contract:
  docs/signals.md. No data is embedded: the page polls /events and /sessions every 5 s, reads /labels once,
  and posts one-key marks to /label. The present edge is now. The board's x40 replay does not ship.

  THE LOG IS READ BY ITS FACTS, NOT BY ITS VERSION NUMBER.
    v1 lines carry the old question keys and no interrupt facts; v2 lines carry interrupted / depth /
    tool_calls / tail_exhausted / tail_error / wrong_room_why and the `intervention` answer. A prompt's
    escape is KNOWN only when `interrupted` is true, or false with neither tail_exhausted nor tail_error.
    Everything else is unknown, and an unknown never counts as a zero: a count with unknowns under it
    prints a dash (none found) or ">=" (some found), and says how many prompts it could read.
    Wants you rests on v1's needs_owner; v2 does not read it, so on a v2 stop it is unread, never "no".

  THE FOUR CRITIC FIXES are marked FIX 1..4 where they live; the reserved headline slot is marked FIX 5.
-->
<script src="/vendor/plotly.min.js"></script>
<style>
:root{
  --paper:#FAF9F5; --surface:#FFFFFF; --fill:#F0EEE6;
  --ink:#141413; --sec:#6B6B68; --line:#E5E3DC;
  --coral:#D97757; --rust:#A6472B;
  --serif:Georgia,"Source Serif 4","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;min-width:1280px;min-height:760px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-size:12px;-webkit-font-smoothing:antialiased}
.app{height:100%;padding:14px 20px 12px;display:flex;flex-direction:column;gap:12px}

/* ---------- header ---------- */
header{height:40px;display:flex;align-items:baseline;gap:14px;flex:0 0 40px}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:-.01em}
.hdr{margin-left:auto;display:flex;align-items:baseline;gap:12px}
.clock{font-family:var(--mono);font-size:17px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rate{color:var(--sec);font-size:11px;font-family:var(--mono)}
.rate.down{color:var(--rust)}

/* ---------- frame ---------- */
.frame{flex:1;display:grid;grid-template-columns:302px 1fr;gap:0;min-height:0}
.band{min-height:0;display:flex;flex-direction:column}
.band > h2{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.11em;
  text-transform:uppercase;color:var(--sec);padding:0 0 7px;
  display:flex;align-items:baseline;gap:8px;flex:0 0 auto;white-space:nowrap}
.band > h2 .r{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:var(--sec);
  overflow:hidden;text-overflow:ellipsis}
.ptitle{font-size:11px;font-weight:500;color:var(--sec);margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-family:var(--serif);font-size:15px;line-height:1.4;color:var(--sec);padding:4px 0}
.empty b{font-weight:400;color:var(--ink)}

/* ---------- verdict ----------
   FIX 5. The alarm swap used to add a line and push the page down 33px. Both states now render the same
   three rows at the same sizes; the calm state carries the second row as a hidden spacer. */
.verdict{flex:0 0 auto;padding:1px 0 0}
.vline{font-family:var(--serif);font-size:30px;line-height:1.12;letter-spacing:-.012em;
  display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.vline b{font-weight:400;font-variant-numeric:tabular-nums}
.vline .w{color:var(--sec)}
.vwants{color:var(--rust);display:flex;align-items:baseline;gap:11px}
.vwants .blk{width:11px;height:23px;background:var(--rust);flex:0 0 11px;align-self:center}
.vsmall{font-size:15px;line-height:1.3;color:var(--sec);margin-top:5px;font-family:var(--serif);white-space:nowrap}
.vsmall b{font-weight:400;color:var(--ink);font-family:var(--mono);font-size:14px}
.vsmall.spacer{visibility:hidden}
.vfine{margin-top:7px;display:flex;gap:15px;align-items:baseline;font-size:10.5px;color:var(--sec);
  white-space:nowrap;overflow:hidden;height:14px}
.vfine b{font-weight:400;color:var(--ink);font-family:var(--mono)}

/* ---------- rail ---------- */
.rail{overflow:hidden;padding-right:14px;position:relative}
.rail:after{content:'';position:absolute;right:0;top:0;width:1px;background:var(--line);height:var(--rh,100%)}
.rail .rows{position:relative;flex:1;overflow:hidden}
.crow{position:absolute;left:0;right:0;border-bottom:1px solid var(--line);
  padding:10px 10px 9px 13px;cursor:pointer;overflow:hidden;
  transition:transform .55s cubic-bezier(.4,0,.2,1),height .35s cubic-bezier(.4,0,.2,1),background-color .3s}
@media (hover:hover){.crow:hover{background:rgba(240,238,230,.55)}}
.crow.sel{background:var(--fill)}
.crow:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.crow.sel:before{background:var(--coral)}
.crow.wants:before{background:var(--rust);width:3px}
.crow .n1{display:flex;align-items:baseline;gap:6px}
.cname{font-family:var(--serif);font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:176px}
.crow.slim .cname{font-size:13.5px;color:var(--sec)}
.crow.slim .spark,.crow.slim .dots{display:none}
.cproj{font-size:10.5px;color:var(--sec);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cproj .c1{color:var(--rust);font-family:var(--sans)}
.state{margin-left:auto;font-size:10.5px;white-space:nowrap}
.state.wants{color:var(--paper);background:var(--rust);padding:2px 7px 3px;font-size:11px;letter-spacing:.01em}
.state.work{color:var(--ink)}
.state.idle,.state.quiet{color:var(--sec)}
.n2{display:flex;align-items:baseline;gap:6px;margin-top:3px;font-size:10.5px;color:var(--sec)}
.n2 .el{margin-left:auto;font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{margin-top:9px;height:26px;width:100%;display:block}
.dots{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--sec);overflow:hidden}
.dots span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots b{font-weight:400;color:rgba(166,71,43,.78)}
.dots .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(166,71,43,.50);
  margin-right:4px;vertical-align:1px}
.dots .c1,.dots .c1 b{color:var(--rust)}
.dots .c1 .dot{background:var(--rust)}
.dots .q .dot{background:rgba(107,107,104,.4)}
.more{position:absolute;left:13px;right:14px;font-size:10.5px;color:var(--sec);padding-top:8px}
.rail .empty{padding:8px 13px}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto 112px auto 1fr 150px;gap:12px;min-height:0;padding-left:16px;position:relative}
#pulse{flex:1;min-height:0;position:relative}
.band.nums{border-top:1px solid var(--line);padding-top:8px}
/* FIX 1 / FIX 3: the shared vertical of the selected chat's Correction, from the Pulse's floor to the
   parameter strip. Painted beneath every band, so an agent turn's white box passes over it. */
#vlines{position:absolute;inset:0;z-index:-1;pointer-events:none}
#vlines i{position:absolute;width:1px;background:rgba(166,71,43,.5)}

/* ---------- parameters ---------- */
.band.params{min-height:126px}
#params{flex:1;min-height:0;position:relative}
#params svg{display:block;width:100%;height:100%}

/* ---------- conversation ---------- */
.band.conv{overflow:hidden;position:relative;max-height:306px}
.scroll{flex:1;overflow:hidden;padding:3px 4px 4px 0}
.spine{position:absolute;left:353px;top:0;bottom:0;width:1px;background:var(--line)}
.turn{position:relative;display:grid;grid-template-columns:344px 18px 1fr}
.mark{position:absolute;left:350.5px;top:5px;width:7px;height:7px;border-radius:50%;
  background:var(--surface);border:1px solid rgba(20,20,19,.35)}
.mark.me{background:var(--coral);border-color:var(--coral)}
.mecell{grid-column:1;text-align:right;padding:0 16px 12px 0}
.agcell{grid-column:3;padding:0 0 12px 16px}
.full{grid-column:1/-1}
.who{font-size:10px;letter-spacing:.04em;color:var(--coral);margin-bottom:3px}
.who span{color:var(--sec);font-family:var(--mono);margin-left:6px}
.me.sys .who{color:var(--sec)}
.me .txt{font-family:var(--serif);font-size:13.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.agbox{border:1px solid var(--line);background:var(--surface);padding:8px 11px 9px;max-width:690px;position:relative}
.agbox.live{border-left:2px solid var(--coral);padding-left:10px}
.agmeta{display:flex;align-items:baseline;gap:9px;font-size:10.5px;color:var(--sec);font-family:var(--mono)}
.agmeta > span{white-space:nowrap;flex:0 0 auto}
.agmeta .ext{flex:0 1 auto;height:3px;background:rgba(20,20,19,.22);display:inline-block;min-width:2px;align-self:center}
.agbox.live .agmeta .ext{background:var(--coral)}
.agmeta .run{color:var(--coral)}
.agtxt{font-size:11.5px;color:var(--sec);margin-top:5px;line-height:1.4;max-width:660px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sigs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.sig{font-size:10.5px;color:rgba(166,71,43,.80);border:1px solid rgba(166,71,43,.26);padding:1px 6px}
.sig.q{color:var(--sec);border-color:var(--line)}
.mk{color:var(--coral);margin-left:6px}
.gap{font-size:10.5px;color:var(--sec);font-family:var(--mono);padding:0 0 14px;text-align:center}
/* GEAR 1. A Correction: the 3px rule, and — FIX 3 — a node where the Pulse's vertical crosses it, with
   the label and his words hanging from that node instead of from the far left edge. */
.cut{position:relative;padding:4px 0 12px}
.cut .rule{height:3px;background:var(--rust)}
.cut .node{position:absolute;top:0;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--rust)}
.cut .node.edge{border-radius:0;width:3px;height:15px;margin-left:-1.5px;top:-2px}
.cut .lab{font-size:10.5px;color:var(--rust);letter-spacing:.03em;margin-top:6px}
.cut .quote{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--rust);margin-top:4px;line-height:1.32}
.cut .noquote{font-size:11px;color:var(--sec);margin-top:3px}
/* A Nudge is not a failure, and must not look like one: a coral hairline, his words in ink. */
.nudge{padding:2px 0 12px}
.nudge .rule{height:1px;background:rgba(217,119,87,.7)}
.nudge .lab{font-size:10.5px;color:var(--coral);letter-spacing:.03em;margin-top:5px}
.nudge .quote{font-family:var(--serif);font-size:13.5px;color:var(--ink);margin-top:3px}
.nudge.unjudged .rule{background:var(--line)}
.nudge.unjudged .lab{color:var(--sec)}

/* ---------- numbers ---------- */
.numsgrid{flex:1;display:grid;grid-template-columns:1fr 556px;gap:0;min-height:0}
.statwrap{padding:0 24px 0 0;display:flex;flex-direction:column;min-height:0}
.stats{display:flex;gap:0;margin-top:8px}
.stat{flex:1;padding-right:16px}
.stat .v{font-family:var(--serif);font-size:19px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .v.alert{color:var(--rust)}
.stat .v.warn{color:rgba(166,71,43,.78)}
.stat .k{font-size:11.5px;margin-left:6px}
.stat .m{font-size:10.5px;color:var(--sec);margin-top:4px;line-height:1.35;font-family:var(--mono)}
.classes{border-left:1px solid var(--line);padding:0 0 0 20px;display:flex;flex-direction:column}
.erow{padding:4px 0 5px;border-bottom:1px solid var(--line)}
.erow .e1{display:flex;align-items:baseline;gap:9px}
.erow .en{font-size:13px}
.erow .elift{font-family:var(--mono);font-size:12px;color:var(--ink);margin-left:auto}
.erow .ekind{font-size:10.5px;color:var(--sec)}
.erow .e2{font-size:10.5px;color:var(--sec);margin-top:2px;font-family:var(--mono);line-height:1.35}
.trust{margin-top:auto;padding-top:7px;font-size:10.5px;color:var(--sec);line-height:1.45}

/* ---------- tooltip ----------
   FIX 4. The ground DIMS — ink at 15% — instead of bleaching to paper at 74%, so the board stays
   legible behind the panel; the subject is raised above the scrim on its own paper; the leader names it.
   The body is one sentence and one mono readout. */
#scrim{position:fixed;inset:0;background:var(--ink);opacity:0;z-index:55;pointer-events:none;transition:opacity .12s}
#scrim.on{opacity:.15}
#leader{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:61;pointer-events:none;opacity:0;transition:opacity .12s}
#leader.on{opacity:1}
.tipsub{z-index:60}
#tip{position:fixed;z-index:62;width:286px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 2px 12px rgba(20,20,19,.10);padding:10px 12px 11px;pointer-events:none;opacity:0;transition:opacity .12s}
#tip .l1{font-size:11.5px;line-height:1.45;color:var(--ink)}
#tip .l2{font-family:var(--mono);font-size:10.5px;color:var(--sec);margin-top:7px;line-height:1.5;word-break:break-word}
[data-tip]{cursor:default}
.crow[data-tip]{cursor:pointer}
.crow:focus-visible,.sig:focus-visible,.cut:focus-visible{outline:1px solid var(--coral);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.crow,#scrim,#leader,#tip{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">Overmind</div>
    <div class="hdr">
      <span class="clock" id="clock">--:--:--</span>
      <span class="rate" id="rate">reading the log…</span>
    </div>
  </header>

  <div class="frame">
    <section class="band rail">
      <h2>Chats <span class="r" id="railcount"></span></h2>
      <div class="rows" id="rows"></div>
    </section>

    <div class="main" id="main">
      <div id="vlines"></div>
      <section class="verdict" id="verdict"></section>

      <section class="band">
        <h2>Pulse &mdash; last 20 minutes, every chat <span class="r" id="pulsekey"></span></h2>
        <div id="pulse"></div>
      </section>

      <section class="band conv">
        <h2><span id="convtitle">Conversation</span> <span class="r" id="convmeta"></span></h2>
        <div class="scroll" id="scroll"></div>
      </section>

      <section class="band params">
        <h2><span id="paramtitle">Parameters</span> <span class="r" id="parammeta"></span></h2>
        <div id="params"></div>
      </section>

      <section class="band nums">
        <div class="numsgrid">
          <div class="statwrap">
            <div class="ptitle" id="statstitle"></div>
            <div class="stats" id="stats"></div>
          </div>
          <div class="classes">
            <div class="ptitle">What the judge has earned &middot; two of nine questions</div>
            <div id="earned"></div>
            <div class="trust" id="trust"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<div id="scrim"></div>
<svg id="leader"><path id="leaderline" fill="none" stroke="rgba(20,20,19,.45)" stroke-width="1"></path>
  <circle id="leaderdot" r="2.5" fill="rgba(20,20,19,.55)"></circle></svg>
<div id="tip" role="tooltip"><div class="l1"></div><div class="l2"></div></div>
<script>
'use strict';
/* ---------- constants ---------- */
const WIN = 20 * 60e3;          // the Pulse and the parameter strip
const IDLE = 10 * 60e3;         // Working -> Idle
const QUIET = 2 * 3600e3;       // Idle -> Quiet
const POLL_MS = 5000;
const OVERLAP = 60e3;           // the hook appends after its Jev call, so a line can land behind the newest ts
const FIRE = 0.5;               // where a signal fires; thresholds are phase 2's to set from labels
const GUT = 150, MR = 10;       // one x geometry for the Pulse and the parameter strip
const PARAMS_MIN = 126;

/* What survived the truncation-matched control: docs/signals.md "What survived measurement";
   experiments/results/conduct-classes-2026-09-17_230813 — 19 corrections against 209 matched clean turns. */
const RUN = {corrections: 19, matched: 209};
const EARNED = [
  {n: 'Acting, not answering', q: 'jumped', kind: 'model question',
   means: 'you asked a question and it started doing work instead', corr: 58, clean: 20, lift: '+38 pp'},
  {n: 'Touching the wrong thing', q: 'wrong_room', kind: 'rule, in code',
   means: 'it touched something outside the task', corr: 21, clean: 2, lift: '+19 pp'}
];
const NOT_EARNED = [
  ['Gone dark', '−6 pp'], ['Missing the point', '+11 pp'], ['Doing too much', '+10 pp'],
  ['Talking too much', '+0 pp'], ['Claiming without proof', 'no ground truth'],
  ['Going in circles', '−7 pp'], ['Caving instead of thinking', '−11 pp']
];
const KIND = {PreToolUse: 'tool', Stop: 'stop', SubagentStop: 'sub', UserPromptSubmit: 'user'};
const WHY = {
  v1: 'a v1 line, and v1 never recorded escapes',
  exhausted: 'the tail window ran out before your previous message',
  tail: 'the transcript could not be read',
  none: 'the line carries no interrupt facts'
};
const WORD = {y: 'right', n: 'wrong', s: 'skip'};
const RANK = {'Wants you': 0, 'Working': 1, 'Idle': 2, 'Quiet': 3};
const CLS = {'Wants you': 'wants', 'Working': 'work', 'Idle': 'idle', 'Quiet': 'quiet'};

/* ---------- state ---------- */
const S = {ev: new Map(), list: [], maxT: 0, sess: {}, labels: [], lastEver: null, loaded: false,
           okAt: 0, failSince: 0};
let NOW = Date.now();
let sel = new URLSearchParams(location.search).get('chat') || '';
let CH = [], BYID = {}, GLOBALMAX = 1;
const LBL = new Map();          // event ts|session|question -> latest label line
const LT = new Map();           // label targets: id -> {q, evs}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\|/g, '/');
}
function tipAttr(a, b) { return 'data-tip="' + esc(a) + '|' + esc(b) + '"'; }
const p2 = n => String(n).padStart(2, '0');
function clock(ms) { const d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()); }
function hhmm(ms) { return clock(ms).slice(0, 5); }
function dur(ms) {
  let s = Math.max(0, Math.round(ms / 1000)); if (s < 60) return s + 's';
  const m = Math.floor(s / 60), r = s % 60; if (m < 60) return m + 'm ' + p2(r) + 's';
  return Math.floor(m / 60) + 'h ' + p2(m % 60) + 'm';
}
function plural(n, w, ws) { return n + ' ' + (n === 1 ? w : (ws || w + 's')); }
function dayStart(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
function iso(ms) { return new Date(ms).toISOString().replace('Z', '+00:00'); }  // the log's own ts format
function X(ms) {  // a local wall-clock string for Plotly, which draws a zone-less date exactly as written
  const d = new Date(ms);
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + clock(ms)
    + '.' + String(d.getMilliseconds()).padStart(3, '0');
}
function when(ms) {
  if (ms >= dayStart(NOW)) return 'at ' + hhmm(ms);
  return new Date(ms).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}) + ', ' + hhmm(ms);
}
function trunc(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function basename(p) { return String(p || '').replace(/\/+$/, '').split('/').pop() || ''; }
function ans(e, q) { const v = e.a[q]; return typeof v === 'number' && isFinite(v) ? v : null; }
function f2(v) { return v == null ? '—' : v.toFixed(2); }
/* A count with unknowns under it: a dash when none was found, ">=" when some were. Never a false zero. */
function known(k, unknown) { return unknown > 0 ? (k > 0 ? '≥' + k : '—') : String(k); }
function textOf(e, key) { return e.state && typeof e.state[key] === 'string' ? e.state[key] : ''; }

/* ---------- reading the log ---------- */
function norm(x) {
  if (!x || typeof x !== 'object' || typeof x.ts !== 'string' || typeof x.session_id !== 'string') return null;
  const t = Date.parse(x.ts);
  if (!isFinite(t)) return null;
  return {
    key: x.ts + '|' + x.session_id + '|' + x.event, ts: x.ts, t: t, sid: x.session_id,
    ev: String(x.event || ''), k: KIND[x.event] || 'other', v: typeof x.v === 'number' ? x.v : null,
    a: x.answers && typeof x.answers === 'object' ? x.answers : {},
    err: x.error ? String(x.error) : '', cwd: typeof x.cwd === 'string' ? x.cwd : '',
    interrupted: typeof x.interrupted === 'boolean' ? x.interrupted : null,
    depth: typeof x.depth === 'number' ? x.depth : null,
    tools: typeof x.tool_calls === 'number' ? x.tool_calls : null,
    exhausted: x.tail_exhausted === true, tailErr: x.tail_error ? String(x.tail_error) : '',
    whyRoom: typeof x.wrong_room_why === 'string' ? x.wrong_room_why : '',
    state: x.state && typeof x.state === 'object' ? x.state : null
  };
}
/* Whether he pressed escape before this prompt. `interrupted: true` is a fact even when the window ran
   out (the marker was inside it); `false` is only a fact when the tail reached his previous message. */
function escOf(e) {
  if (e.interrupted === true) {
    const p = ans(e, 'intervention');
    return {known: true, hit: true, p: p, kind: p == null ? 'Escape' : p >= FIRE ? 'Correction' : 'Nudge'};
  }

   what: 'a hook question over the command before it runs', none: 'no Bash call judged here today'},
  {n: 'Acting, not answering', src: 'every stop, v2', q: 'jumped', hit: e => e.k === 'stop', v2only: true,
   what: 'the one conduct question that survived the matched control', none: 'no stop judged here today'},
  {n: 'Correction or Nudge', src: 'every escape · 1 is a Correction', q: 'intervention', hit: e => e.k === 'user', v2only: true,
   what: 'the register of what you said after an escape: 1.0 objects, 0.0 carries on',
   none: c => c.X ? plural(c.X, 'escape') + ' here today, none judged'
     : c.U ? 'no escape read here today, and ' + plural(c.U, 'prompt') + ' could not be read' : 'no escape here today'}
];
function renderParams() {
  const c = BYID[sel], host = $('#params');
  const W = host.clientWidth, H = host.clientHeight;
  if (W < 40 || H < 40) return;
  if (!c) {
    host.innerHTML = '<div class="empty" style="padding-left:' + GUT + 'px">Nothing to plot: no chat has fired a hook today.</div>';
    $('#paramtitle').textContent = 'Parameters'; $('#parammeta').textContent = '';
    return;
  }
  const X0 = GUT, X1 = W - MR, t0 = NOW - WIN, xOf = t => X0 + (t - t0) / WIN * (X1 - X0);
  const TOP = 17, lh = (H - TOP - 4) / PLANES.length;
  let g = '';
  const d = new Date(t0); d.setSeconds(0, 0);
  if (d.getTime() < t0) d.setMinutes(d.getMinutes() + 1);
  d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5);  /* the Pulse's local five-minute gridlines */
  for (let k = d.getTime(); k <= NOW; k += 300000)
    g += '<line x1="' + xOf(k).toFixed(1) + '" y1="0" x2="' + xOf(k).toFixed(1) + '" y2="' + H + '" stroke="#EBE8DF" stroke-width="1"/>';
  PLANES.forEach((L, i) => {
    const top = TOP + i * lh, base = top + lh - 14, span = lh - 22;
    const yOf = v => base - Math.max(0, Math.min(1, v)) * span;
    const all = c.day.filter(e => L.hit(e) && ans(e, L.q) != null && e.t <= NOW);
    const win = all.filter(e => e.t >= t0);
    g += '<line x1="' + X0 + '" y1="' + base.toFixed(1) + '" x2="' + X1 + '" y2="' + base.toFixed(1) + '" stroke="#E5E3DC" stroke-width="1"/>'
      + '<line x1="' + X0 + '" y1="' + yOf(.5).toFixed(1) + '" x2="' + X1 + '" y2="' + yOf(.5).toFixed(1)
      + '" stroke="rgba(107,107,104,.30)" stroke-width="1" stroke-dasharray="2 4"/>'
      + '<text x="' + (GUT - 10) + '" y="' + (base - 4).toFixed(1) + '" text-anchor="end" font-family="' + SANS + '" font-size="10" fill="#6B6B68">' + esc(L.n) + '</text>'
      + '<text x="' + (GUT - 10) + '" y="' + (base + 7).toFixed(1) + '" text-anchor="end" font-family="' + MONO + '" font-size="9" fill="rgba(107,107,104,.8)">' + esc(L.src) + '</text>';
    if (win.length) {
      let dd = '';
      win.forEach((e, k) => {
        const v = ans(e, L.q), x = xOf(e.t), y = yOf(v);
        g += '<line x1="' + x.toFixed(1) + '" y1="' + base.toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1)
          + '" stroke="' + (v >= FIRE ? 'rgba(166,71,43,.45)' : 'rgba(20,20,19,.20)') + '" stroke-width="1"/>';
        dd += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      });
      if (win.length > 1) g += '<path d="' + dd + '" fill="none" stroke="rgba(20,20,19,.32)" stroke-width="1"/>';
      win.forEach(e => {
        const v = ans(e, L.q);
        g += '<circle cx="' + xOf(e.t).toFixed(1) + '" cy="' + yOf(v).toFixed(1) + '" r="' + (v >= FIRE ? 3.2 : 2.2)
          + '" fill="' + (v >= FIRE ? 'rgba(166,71,43,.88)' : 'rgba(20,20,19,.48)') + '"/>';
      });
      const hi = Math.max.apply(null, win.map(e => ans(e, L.q)));
      const busyLeft = win.some(e => xOf(e.t) < X0 + 150 && ans(e, L.q) >= .55);
      g += '<text x="' + (busyLeft ? X1 : X0 + 6) + '" y="' + (top + 10).toFixed(1) + '" text-anchor="' + (busyLeft ? 'end' : 'start')
        + '" font-family="' + MONO + '" font-size="10" fill="' + (hi >= FIRE ? 'rgba(166,71,43,.74)' : '#6B6B68') + '">highest ' + hi.toFixed(2) + '</text>';
    } else {
      const neverAsked = L.v2only && !c.day.some(e => L.hit(e) && e.v !== 1) && c.day.some(e => L.hit(e));
      g += '<text x="' + (X0 + 6) + '" y="' + (top + 10).toFixed(1) + '" font-family="' + SANS + '" font-size="10" fill="rgba(107,107,104,.75)">'
        + esc(all.length ? 'nothing to read in these twenty minutes, the last was at ' + hhmm(all[all.length - 1].t)
          : neverAsked ? 'only v1 lines here, and v1 never asked this' : typeof L.none === 'function' ? L.none(c) : L.none) + '</text>';
    }
    const fired = all.filter(e => ans(e, L.q) >= FIRE).length;
    g += '<rect x="' + X0 + '" y="' + top.toFixed(1) + '" width="' + (X1 - X0) + '" height="' + lh.toFixed(1) + '" fill="transparent" '
      + tipAttr(L.n + ' is ' + L.what + ', and every stem is one reading at the moment it happened.',
        plural(all.length, 'reading') + ' in ' + c.name + ' today, ' + fired + ' over 0.50 · ' + win.length + ' in these twenty minutes') + '></rect>';
  });
  c.day.filter(e => e.t >= t0 && (e.k === 'user' || e.k === 'stop')).forEach(e => {
    if (e.k === 'user' && e.esc && e.esc.kind === 'Correction') return;
    g += '<line x1="' + xOf(e.t).toFixed(1) + '" y1="2" x2="' + xOf(e.t).toFixed(1) + '" y2="12" stroke="'
      + (e.k === 'user' ? '#D97757" stroke-width="2' : 'rgba(20,20,19,.55)" stroke-width="1.4') + '"/>';
  });
  c.cuts.forEach(e => {
    const inWin = e.t >= t0, x = inWin ? xOf(e.t) : X0;
    const q = textOf(e, 'prompt');
    const tip = tipAttr('A Correction in ' + c.name + ', and everything right of this rule happened after you made it.',
      clock(e.t) + ' · intervention ' + f2(e.esc.p) + (q ? ' · “' + trunc(q, 70) + '”' : ''));
    if (inWin) g += '<line x1="' + x.toFixed(1) + '" y1="0" x2="' + x.toFixed(1) + '" y2="' + H + '" stroke="#A6472B" stroke-width="3"/>'
      + '<text x="' + (x - 6).toFixed(1) + '" y="10" text-anchor="end" font-family="' + SANS + '" font-size="9.5" fill="#A6472B">Correction ' + hhmm(e.t) + '</text>'
      + '<rect x="' + (x - 7).toFixed(1) + '" y="0" width="14" height="' + H + '" fill="transparent" ' + tip + '></rect>';
  });
  const older = c.cuts.filter(e => e.t < t0);
  if (older.length) {
    const lb = older[older.length - 1];
    const lab = '‹ ' + (older.length === 1 ? 'Correction ' + hhmm(lb.t) : older.length + ' Corrections, last ' + hhmm(lb.t));
    g += '<rect x="' + (X0 + 3) + '" y="0" width="' + (lab.length * 5.6 + 6).toFixed(0) + '" height="13" fill="#FAF9F5"/>'
      + '<line x1="' + (X0 + 1.5) + '" y1="0" x2="' + (X0 + 1.5) + '" y2="13" stroke="#A6472B" stroke-width="3"/>'
      + '<text x="' + (X0 + 6) + '" y="10" font-family="' + SANS + '" font-size="9.5" fill="#A6472B">' + lab + '</text>';
  }
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + g + '</svg>';
  $('#paramtitle').textContent = 'Parameters — ' + c.name;
  $('#parammeta').textContent = 'the same twenty minutes as the Pulse, on the same axis · every reading 0 to 1, the dashes are 0.50, where a signal fires';
}

/* ---------- numbers ---------- */
function renderNums() {
  const c = BYID[sel];
  if (!c) {
    $('#statstitle').textContent = 'The same chat, counted';
    $('#stats').innerHTML = '<div class="empty">No chat to count.</div>';
  } else {
    const P = c.prompts.length, R = P - c.U;
    const whyTxt = Object.keys(c.why).map(k => c.why[k] + ' ' + WHY[k]).join(' · ');
    const readM = c.U ? 'read on ' + R + ' of ' + plural(P, 'prompt') : 'of ' + plural(P, 'prompt') + ' since ' + hhmm(c.first);
    const stats = [
      [known(c.K, c.U), 'Correction' + (c.K === 1 ? '' : 's'), readM, c.K > 0 ? 'alert' : '',
       'A Correction is an escape whose next message objects, the one label the system gets for free.',
       (c.cuts.map(e => clock(e.t)).join(', ') || 'none found') + ' · escapes read on ' + R + ' of ' + P + ' prompts' + (c.U ? ' (' + whyTxt + ')' : '')],
      [known(c.N, c.U), 'Nudge' + (c.N === 1 ? '' : 's'), c.X ? plural(c.X, 'escape') + ' not judged' : 'escapes that jumped the queue', '',
       'A Nudge is an escape whose next message carries on, which is not a failure.',
       c.N + ' Nudges, ' + c.K + ' Corrections, ' + c.X + ' not judged · over 90 days, 24 of 46 escapes were Nudges'],
      [c.risky.length, 'Near miss' + (c.risky.length === 1 ? '' : 'es'), 'of ' + plural(c.bashJ.length, 'Bash call') + ' judged'
        + (c.bash.length > c.bashJ.length ? ', ' + (c.bash.length - c.bashJ.length) + ' not' : ''), c.risky.length ? 'warn' : '',
       'About to break something is a hook question over the command before it runs, not a conduct class.',
       c.risky.length + ' fired of ' + c.bashJ.length + ' judged = ' + (c.bashJ.length ? Math.round(100 * c.risky.length / c.bashJ.length) : 0) + '%'],
      [c.turns.length, 'Turn' + (c.turns.length === 1 ? '' : 's'), 'of ' + plural(c.day.length, 'event') + ', since ' + hhmm(c.first), '',
       'A turn is one exchange: your message, then what the agent did until it stopped.',
       c.turns.filter(t => t.kind === 'owner').length + ' opened by you · ' + plural(c.stops.length, 'stop') + ' · ' + plural(c.bash.length, 'Bash call')]
    ];
    $('#stats').innerHTML = stats.map(a => '<div class="stat" ' + tipAttr(a[4], a[5]) + '><div><span class="v' + (a[3] ? ' ' + a[3] : '') + '">'
      + esc(a[0]) + '</span><span class="k">' + a[1] + '</span></div><div class="m">' + esc(a[2]) + '</div></div>').join('');
    $('#statstitle').textContent = c.name + ', counted today · each number names its own window';
  }
  $('#earned').innerHTML = EARNED.map(cl => {
    const J = c ? (cl.q === 'jumped' ? c.jumpJ : c.roomJ) : [], F = c ? (cl.q === 'jumped' ? c.jumpF : c.roomF) : [];
    const here = !c ? 'no chat selected' : J.length ? F.length + ' of ' + plural(J.length, 'turn') + ' here today'
      : c.stops.length && c.stops.every(e => e.v === 1) ? 'never asked on v1 lines' : 'not asked here today';
    const marks = S.labels.filter(l => l.question === cl.q).length;
    return '<div class="erow" ' + tipAttr(cl.n + ': ' + cl.means + '.',
        'fires on ' + cl.corr + '% of ' + RUN.corrections + ' corrections and ' + cl.clean + '% of ' + RUN.matched
        + ' matched clean turns = ' + cl.lift + ' · fires at 0.50 · ' + here + ' · ' + plural(marks, 'mark') + ' of yours')
      + '><div class="e1"><span class="en">' + cl.n + '</span><span class="ekind">' + cl.kind + '</span><span class="elift">' + cl.lift + '</span></div>'
      + '<div class="e2">' + cl.corr + '% of ' + RUN.corrections + ' corrections vs ' + cl.clean + '% of ' + RUN.matched
      + ' matched clean turns · ' + here + '</div></div>';
  }).join('');
  const mj = S.labels.filter(l => l.question === 'jumped').length, mw = S.labels.filter(l => l.question === 'wrong_room').length;
  $('#trust').innerHTML = '<span ' + tipAttr('Seven more questions are named in docs/signals.md and none survived the matched control, so none is on this board.',
      NOT_EARNED.map(x => x[0] + ' ' + x[1]).join(' · ')) + '>Seven more questions, none earned. Neither may act until its curve tracks you: '
    + mj + ' and ' + mw + ' of your marks so far, about 20 each needed.</span>';
}

/* ---------- tooltip ---------- */
const tipEl = $('#tip'), scrimEl = $('#scrim'), leadEl = $('#leader'), leadLine = $('#leaderline'), leadDot = $('#leaderdot');
let subEl = null, tipLT = null, mouse = {x: -1, y: -1};
function dropSub() { if (subEl) { subEl.classList.remove('tipsub'); subEl.style.position = subEl.dataset.pos || ''; subEl.style.background = subEl.dataset.bg || ''; subEl = null; } }
function opaque(bg) { const m = /rgba\([^)]*,\s*([\d.]+)\)/.exec(bg); return bg !== 'transparent' && (!m || +m[1] === 1); }
function groundOf(el) {
  for (; el && el !== document.documentElement; el = el.parentElement) { const bg = getComputedStyle(el).backgroundColor; if (opaque(bg)) return bg; }
  return 'var(--paper)';
}
function hideTip() { tipEl.style.opacity = 0; scrimEl.classList.remove('on'); leadEl.classList.remove('on'); dropSub(); tipLT = null; }
function showTip(a, b, r, raise, lt) {
  tipEl.children[0].textContent = a || ''; tipEl.children[1].textContent = b || '';
  tipLT = lt || null;
  const RAILR = document.querySelector('.rail').getBoundingClientRect().right;
  const w = 286, h = tipEl.offsetHeight || 80, VW = window.innerWidth, VH = window.innerHeight;
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const LEFT = RAILR + 12, RIGHT = VW - 8, BOT = VH - 8;
  let x, y;
  if (r.left < RAILR) { x = LEFT; y = cl(r.top - 2, 8, BOT - h); }
  else if (r.right + 14 + w <= RIGHT) { x = r.right + 14; y = cl(r.top - 2, 8, BOT - h); }
  else if (r.left - 14 - w >= LEFT) { x = r.left - w - 14; y = cl(r.top - 2, 8, BOT - h); }
  else if (r.bottom + 12 + h <= BOT) { x = cl(r.left, LEFT, RIGHT - w); y = r.bottom + 12; }
  else { x = cl(r.left, LEFT, RIGHT - w); y = cl(r.top - h - 12, 8, BOT - h); }
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.style.opacity = 1;
  if (raise !== subEl) {
    dropSub(); subEl = raise; raise.classList.add('tipsub');
    const cs = getComputedStyle(raise);
    raise.dataset.pos = raise.style.position; raise.dataset.bg = raise.style.background;
    if (cs.position === 'static') raise.style.position = 'relative';
    if (!opaque(cs.backgroundColor)) raise.style.background = groundOf(raise.parentElement);
  }
  scrimEl.classList.add('on');
  const pc = {x: x + w / 2, y: y + h / 2};
  const sx = cl(pc.x, r.left + 2, r.right - 2), sy = cl(pc.y, r.top + 2, r.bottom - 2);
  const px = cl(sx, x, x + w), pyy = cl(sy, y, y + h);
  leadLine.setAttribute('d', 'M' + px.toFixed(1) + ' ' + pyy.toFixed(1) + 'L' + sx.toFixed(1) + ' ' + sy.toFixed(1));
  leadDot.setAttribute('cx', sx.toFixed(1)); leadDot.setAttribute('cy', sy.toFixed(1));
  leadEl.classList.add('on');
}
function tipFor(el) {
  if (!el) { hideTip(); return; }
  const a = el.getAttribute('data-tip').split('|');
  const raise = el.ownerSVGElement ? el.ownerSVGElement.parentNode : el;
  const lt = el.getAttribute('data-lt') ? LT.get(el.getAttribute('data-lt')) : null;
  showTip(a[0], a[1], el.getBoundingClientRect(), raise, lt);
}
document.addEventListener('mousemove', ev => {
  mouse = {x: ev.clientX, y: ev.clientY};
  if (ev.target.closest && ev.target.closest('#pulse')) return;   /* the Pulse reports its own hover */
  tipFor(ev.target.closest ? ev.target.closest('[data-tip]') : null);
});
document.addEventListener('focusin', ev => { const el = ev.target.closest && ev.target.closest('[data-tip]'); if (el) tipFor(el); });
document.addEventListener('focusout', () => hideTip());

/* ---------- one-key labels ---------- */
async function mark(lt, key) {
  const e = lt.evs.find(x => !labelOf(x, lt.q)) || lt.evs[lt.evs.length - 1];
  const line2 = tipEl.children[1];
  try {
    const r = await fetch('/label', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({event_ts: e.ts, session_id: e.sid, question: lt.q, label: key})});
    const body = await r.json();
    if (!r.ok) throw new Error(body && body.error || String(r.status));
    S.labels.push(body); indexLabels();
    line2.textContent = line2.textContent.replace(/ · (not marked yet|you marked it \w+|you skipped it|\d+ of \d+ marked) · press.*$/, '') + keysHint(lt);
    renderAll(true);
    const el = document.elementFromPoint(mouse.x, mouse.y);
    const again = el && el.closest && el.closest('[data-tip]');
    if (again && !(el.closest('#pulse'))) tipFor(again);
  } catch (err) {
    line2.textContent += ' · the mark was not saved: ' + err.message;
  }
}
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
  const k = ev.key.toLowerCase(); if (!WORD[k]) return;
  const f = document.activeElement, lt = tipLT || (f && f.getAttribute && f.getAttribute('data-lt') ? LT.get(f.getAttribute('data-lt')) : null);
  if (!lt) return;
  ev.preventDefault(); mark(lt, k);
});

/* ---------- loop ---------- */
let lastCap = 0;
function setConvCap() {
  const main = $('#main'), v = $('#verdict').getBoundingClientRect().height;
  const cap = Math.round(main.getBoundingClientRect().height - 4 * 12 - bandH - 150 - v - PARAMS_MIN);
  if (cap !== lastCap) { lastCap = cap; document.querySelector('.band.conv').style.maxHeight = Math.max(60, cap) + 'px'; convKey = ''; }
}
function renderHeader() {
  $('#clock').textContent = clock(NOW);
  const rate = $('#rate');
  const date = new Date(NOW).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'});
  if (S.failSince) { rate.textContent = date + ' · no answer from the server since ' + clock(S.failSince); rate.className = 'rate down'; }
  else { rate.textContent = date + ' · live, read every 5 s'; rate.className = 'rate'; }
}
function renderAll(force) {
  NOW = Date.now();
  build();
  renderHeader(); renderVerdict(); renderPulse(); setConvCap(); renderRail();
  renderConv(force); renderParams(); renderNums(); placeCuts();
}
function tick() {
  NOW = Date.now();
  renderHeader();
  if (CH.length) { renderRail(); slidePulse(); renderParams(); const c = BYID[sel]; if (c) updateLive(c); placeCuts(); }
}
renderKey();
renderAll(true);
poll();
setInterval(tick, 1000);
window.addEventListener('resize', () => { convKey = ''; renderAll(true); });
</script>
</body>
